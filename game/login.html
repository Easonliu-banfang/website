<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="yXPXWRCchvwOrYQLbBeY9H">
<head data-page-node-id="SB5e8NmvnqKGw6ahpVs3lw">
  <meta charset="UTF-8" data-page-node-id="tTk9t3Log3J1wG8xRUCCmQ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="6RcrQx0vZkgsOqoke8CZOI">
  <title>登录 · 游戏室</title>
  <meta name="description" content="登录后进入游戏室" data-page-node-id="7uwcdtYecvMO18rTlaZGgy">
  <meta name="theme-color" content="#0a0e14" data-page-node-id="xtYsq71ZKot9nVBDifiDbK">
  <link rel="stylesheet" href="style.css?v=b24" data-page-node-id="hkPgOULPoUGXgrnb0J2XY9">
  <style>
    /* ---------- 登录/注册页 ---------- */
    .login-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-color: var(--bg);   /* 深色底，避免半透明渐变露出白底 */
      background-image: radial-gradient(1200px 600px at 80% -10%, rgba(34,211,238,0.08), transparent 60%),
                  radial-gradient(1000px 500px at 10% 110%, rgba(167,139,250,0.10), transparent 55%);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-elev);    /* 更实的深色卡面，白字清晰 */
      border: 1px solid var(--card-edge);
      border-radius: 20px;
      padding: 34px 32px 26px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #22d3ee, #a78bfa);
    }
    .login-brand { text-align: center; margin-bottom: 24px; }
    .login-logo {
      width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 14px;
      background: linear-gradient(135deg, rgba(34,211,238,0.2), rgba(167,139,250,0.2));
      border: 1px solid rgba(34,211,238,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
    }
    .login-brand h1 { font-family: var(--mono); font-size: 20px; font-weight: 600; letter-spacing: 0.5px; color: var(--text); }
    .login-brand p { font-size: 13px; color: var(--dim); margin-top: 5px; }

    /* 切换标签 */
    .login-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: rgba(255,255,255,0.05); padding: 5px; border-radius: 12px; margin-bottom: 20px; }
    .login-tab {
      padding: 9px 0; text-align: center; border-radius: 9px; cursor: pointer;
      font-family: var(--mono); font-size: 14px; color: var(--dim);
      transition: all 0.2s ease; border: none; background: none;
    }
    .login-tab:hover { color: var(--text); }
    .login-tab.on { background: rgba(34,211,238,0.15); color: var(--cyan); box-shadow: 0 2px 10px rgba(34,211,238,0.15); }

    .login-field { margin-bottom: 14px; }
    .login-field label { display: block; font-family: var(--mono); font-size: 12px; color: var(--dim); letter-spacing: 0.5px; margin-bottom: 6px; }
    .login-input {
      width: 100%; padding: 12px 14px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06);
      color: var(--text); font-size: 15px; outline: none; box-sizing: border-box;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .login-input::placeholder { color: var(--faint); }
    .login-input:focus { border-color: rgba(34,211,238,0.5); box-shadow: 0 0 0 3px rgba(34,211,238,0.12); }

    .login-submit {
      width: 100%; margin-top: 6px; padding: 13px 0; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #22d3ee, #38bdf8); color: #06222b;
      font-family: var(--mono); font-size: 15px; font-weight: 700; letter-spacing: 1px;
      cursor: pointer; transition: all 0.18s ease; box-shadow: 0 4px 18px rgba(34,211,238,0.25);
    }
    .login-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(34,211,238,0.35); }
    .login-submit:disabled { opacity: 0.5; cursor: wait; transform: none; }

    /* 头像上传（注册时显示） */
    .login-avatar { display: none; }
    .login-avatar.show { display: block; }
    .avatar-upload {
      display: flex; align-items: center; gap: 14px; margin-top: 8px;
    }
    .avatar-preview {
      width: 64px; height: 64px; border-radius: 50%; flex: none;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.12), rgba(255,255,255,0.03) 70%);
      border: 2px dashed rgba(255,255,255,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: var(--dim, #8a94b8); text-align: center;
      overflow: hidden; line-height: 1.3;
    }
    .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-preview.has { border-style: solid; }
    .avatar-upload-label {
      display: inline-block; cursor: pointer;
      border: 1px solid rgba(140,160,255,0.3); border-radius: 10px;
      padding: 8px 16px; font-size: 13px; font-weight: 700;
      background: rgba(255,255,255,0.05); color: var(--text-hi, #eef1ff);
      transition: all .15s;
    }
    .avatar-upload-label:hover { border-color: rgba(34,211,238,0.6); background: rgba(34,211,238,0.10); }
    .avatar-upload .avatar-meta { font-size: 11px; color: var(--dim, #8a94b8); line-height: 1.5; }
    #avatarFile { display: none; }
    .login-msg {
      min-height: 22px; margin-top: 12px; text-align: center;
      font-size: 13px; font-family: var(--mono);
    }
    .login-msg.err { color: #f87171; }
    .login-msg.ok { color: #34d399; }

  </style>
</head>
<body class="login-body" data-page-node-id="gKQ1qJGllr9i3OqiqZ0k8b">

  <div class="login-card" data-page-node-id="O3j99ox1O5n0uqxiqh7srw">
    <div class="login-brand" data-page-node-id="Smqau8Lmia8a2ocG9heIEQ">
      <div class="login-logo" data-page-node-id="JdYvGYKrF2tqlNL3Q381D9">🎮</div>
      <h1 data-page-node-id="SYekEALHWOtz5MXKyrWys9">游戏室</h1>
      
    </div>

    <!-- 切换：登录 / 注册 -->
    <div class="login-tabs" data-page-node-id="I4TaCD03V3iAdH88zhlXxZ">
      <button class="login-tab on" id="tabLogin" type="button" data-page-node-id="lZ3icOh06MzOPEJ5mDokiD">登录</button>
      <button class="login-tab" id="tabRegister" type="button" data-page-node-id="OLsnyshWMOhWYIRBMFs0UC">注册</button>
    </div>

    <form id="loginForm" autocomplete="on" data-page-node-id="roSC6XbFib1Aj6ByYd33Cs">
      <div class="login-field" data-page-node-id="sNGp4BH6jrlroKdnUjhLhf">
        <label for="username" data-page-node-id="UYUMU0nDt36nRNOu4u4DLC">用户名</label>
        <input class="login-input" id="username" name="username" maxlength="10" placeholder="1-10 位，中英文/数字（可混合）" autocomplete="username" spellcheck="false" data-page-node-id="MgDii3upjWG80LBqmC3YIQ" />
      </div>
      <div class="login-field" data-page-node-id="GCMh7u1uTgW086eR3Hh5VN">
        <label for="password" data-page-node-id="ZSdo0kbXGJwPLTH6LNYlPE">密码</label>
        <input class="login-input" id="password" name="password" type="password" maxlength="64" placeholder="6-64 位" autocomplete="current-password" data-page-node-id="awLJDeLlFU3tJGdy6idtww" />
      </div>
      <div class="login-field login-avatar" id="avatarField">
        <label>自定义头像 <span style="opacity:.6;margin-left:6px">可不选，自动用默认头像</span></label>
        <div class="avatar-upload">
          <div class="avatar-preview" id="avatarPreview">默认头像</div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <label class="avatar-upload-label" for="avatarFile">选择图片</label>
            <input type="file" id="avatarFile" accept="image/*" />
            <span class="avatar-meta" id="avatarMeta">支持 JPG/PNG/WebP，自动压缩至 25KB 内</span>
          </div>
        </div>
      </div>
      <button class="login-submit" id="btnSubmit" type="submit" data-page-node-id="w0CSRrVMh8M02PHJT4bSR8">登 录</button>
      <div class="login-msg" id="loginMsg" data-page-node-id="9PfUhqn8JGllWLe7I3BXR6"></div>
    </form>

  </div>

<script>
(function () {
  'use strict';

  var WORKER = 'https://quoridor-mp.pages.dev';
  var mode = 'login';
  var $ = function (id) { return document.getElementById(id); };

  var returnTo = (new URLSearchParams(location.search)).get('return') || 'index.html';
  if (!/^[a-zA-Z0-9\/._-]+$/.test(returnTo)) returnTo = 'index.html';

  var savedUser = null;
  try { savedUser = localStorage.getItem('game_username'); } catch (e) {}
  // 已登录（本地有 token）→ 直接进入，无需重复登录
  try {
    if (localStorage.getItem('game_token')) { location.replace(returnTo); return; }
  } catch (e) {}

  // 头像：注册时可自定义上传图片，自动压缩至 25KB 内；不上传则用默认头像
  var AVATAR_LIMIT = 25 * 1024;                  // 25KB
  var selectedAvatar = null;                     // dataURI；null = 使用默认头像
  (function buildAvatarUploader() {
    var file = $('avatarFile'), prev = $('avatarPreview');
    if (!file) return;
    var saved = null;
    try { saved = localStorage.getItem('game_avatar'); } catch (e) {}
    if (saved && saved.indexOf('data:image/') === 0) { selectedAvatar = saved; renderPreview(saved); }
    file.addEventListener('change', function () {
      var f = file.files && file.files[0];
      if (!f) return;
      var img = new Image();
      img.onload = function () {
        var dataUri = compressImage(img, f.type || 'image/jpeg');
        if (!dataUri) return;
        selectedAvatar = dataUri;
        renderPreview(dataUri);
        var meta = $('avatarMeta');
        if (meta) meta.textContent = '已压缩至 ' + Math.ceil(dataUri.length / 1024) + 'KB（上限 25KB）';
      };
      img.onerror = function () { $('avatarMeta').textContent = '图片读取失败，请换一张'; };
      img.src = URL.createObjectURL(f);
    });
    function renderPreview(uri) {
      prev.classList.add('has');
      prev.innerHTML = '';
      var im = document.createElement('img');
      im.src = uri; im.alt = '';
      prev.appendChild(im);
    }
  })();

  /* 图片压缩：缩到 256px 边长 + 逐档降质，直到 ≤25KB */
  function compressImage(img, mime) {
    var N = 256;
    var canvas = document.createElement('canvas');
    canvas.width = N; canvas.height = N;
    var ctx = canvas.getContext('2d');
    var min = Math.min(img.width, img.height);
    ctx.drawImage(img,
      (img.width - min) / 2, (img.height - min) / 2, min, min,   // 居中裁方
      0, 0, N, N);
    var quals = [0.82, 0.7, 0.6, 0.5, 0.4, 0.3];
    var type = (mime && mime.indexOf('png') >= 0) ? 'image/jpeg' : (mime || 'image/jpeg');
    // 优先尝试原始类型（webp/png）；太大则转 jpeg 降质
    var tries = [mime && mime !== 'image/gif' ? mime : 'image/jpeg', 'image/jpeg'];
    for (var t = 0; t < tries.length; t++) {
      for (var i = 0; i < quals.length; i++) {
        var uri = canvas.toDataURL(tries[t], quals[i]);
        if (uri.length <= AVATAR_LIMIT + 1000) return uri;    // base64 略膨胀，留余量
      }
    }
    return canvas.toDataURL('image/jpeg', 0.25);
  }

  function setMode(m) {
    mode = m;
    $('tabLogin').classList.toggle('on', m === 'login');
    $('tabRegister').classList.toggle('on', m === 'register');
    $('btnSubmit').textContent = m === 'login' ? '登 录' : '注 册';
    if ($('avatarField')) $('avatarField').classList.toggle('show', m === 'register');
    $('loginMsg').textContent = '';
    $('loginMsg').className = 'login-msg';
    if (savedUser && m === 'login' && !$('username').value) $('username').value = savedUser;
  }
  $('tabLogin').addEventListener('click', function () { setMode('login'); });
  $('tabRegister').addEventListener('click', function () { setMode('register'); });
  if (savedUser) $('username').value = savedUser;

  function enter() {
    location.href = returnTo;
  }

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var username = ($('username').value || '').trim();
    var password = $('password').value || '';
    if (!username || !password) {
      showMsg('请填写用户名和密码', 'err');
      return;
    }
    $('btnSubmit').disabled = true;
    $('btnSubmit').textContent = mode === 'login' ? '登录中…' : '注册中…';
    fetch(WORKER + '/api/auth/' + (mode === 'login' ? 'login' : 'register'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(mode === 'register'
        ? { username: username, password: password, avatar: selectedAvatar || undefined }
        : { username: username, password: password }),
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) { showMsg(res.d.err || '操作失败', 'err'); return; }
        if (mode === 'register') {
          // 注册成功 → 自动登录（直接发 token，无需再手动登录）
          try {
            localStorage.setItem('game_token', res.d.token);
            localStorage.setItem('game_username', res.d.username);
            if (res.d.avatar || selectedAvatar) localStorage.setItem('game_avatar', res.d.avatar || selectedAvatar);
            localStorage.removeItem('game_skip_auth');
          } catch (err) {}
          enter();
        } else {
          // 登录成功 → 存 token + 记住账号 → 进入
          try {
            localStorage.setItem('game_token', res.d.token);
            localStorage.setItem('game_username', res.d.username);
            localStorage.removeItem('game_skip_auth');
          } catch (err) {}
          enter();
        }
      })
      .catch(function (err) {
        showMsg('网络错误，请稍后重试', 'err');
      })
      .finally(function () {
        $('btnSubmit').disabled = false;
        if (mode === 'login') $('btnSubmit').textContent = '登 录';
        else $('btnSubmit').textContent = '注 册';
      });
  });

  function showMsg(text, cls) {
    $('loginMsg').textContent = text;
    $('loginMsg').className = 'login-msg ' + cls;
  }

  // 回车提交
  $('password').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('loginForm').dispatchEvent(new Event('submit', { cancelable: true }));
  });
})();
</script>
