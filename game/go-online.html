<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>围棋 · 互联网对战</title>
  <meta name="description" content="围棋 Go —— 创建或加入联机房间">
  <meta name="theme-color" content="#0a0e14">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="head">
  <a href="go.html?v=b2" class="back">← 选择模式</a>
  <h1>互联网对战</h1>
</header>

<section class="start">
  <div class="start-inner">
    <p class="start-sub">和好友联机对决</p>
    <h2 class="start-title">创建或加入房间</h2>

    <div class="online-panel">

      <!-- 围棋：棋盘尺寸（仅本机创建时选择，加入方沿用房主尺寸） -->
      <div class="card" id="sizeCard">
        <span class="cap">棋盘尺寸</span>
        <div class="size-pick inline">
          <button class="size-btn active" data-size="9" type="button">9 路</button>
          <button class="size-btn" data-size="13" type="button">13 路</button>
          <button class="size-btn" data-size="19" type="button">19 路</button>
        </div>
      </div>

      <!-- 初始：两个入口 -->
      <div class="btn-row" id="menuRow">
        <button id="btnCreate" class="btn" type="button">创建房间</button>
        <button id="btnJoin" class="btn" type="button">加入房间</button>
      </div>

      <!-- 创建后：只显示房间码 + 进入游戏 -->
      <div id="createView" hidden>
        <span class="cap">房间码（发给朋友）</span>
        <div class="code-box">
          <b id="roomCode">------</b>
          <button id="btnCopy" class="btn ghost" type="button">复制</button>
        </div>
        <div class="btn-row enter-row">
          <a id="btnEnter" class="btn on" href="#">进入游戏 →</a>
        </div>
        <button class="back-link" id="btnBackCreate" type="button">← 返回</button>
      </div>

      <!-- 加入：输入框 + 加入游戏 -->
      <div id="joinView" hidden>
        <span class="cap">输入 6 位房间码</span>
        <div class="join-row">
          <input id="inputCode" class="code-input" maxlength="6" placeholder="房间码" autocomplete="off" spellcheck="false" />
        </div>
        <div class="btn-row enter-row">
          <button id="btnJoinGo" class="btn on" type="button">加入游戏</button>
        </div>
        <button class="back-link" id="btnBackJoin" type="button">← 返回</button>
      </div>

      <div class="status" id="status">未连接</div>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';

  var WORKER = 'https://quoridor-mp.pages.dev';
  var GAME = 'go';
  var size = 9;

  var status = document.getElementById('status');
  var menuRow = document.getElementById('menuRow');
  var btnCreate = document.getElementById('btnCreate');
  var btnJoin = document.getElementById('btnJoin');
  var createView = document.getElementById('createView');
  var roomCode = document.getElementById('roomCode');
  var btnCopy = document.getElementById('btnCopy');
  var btnEnter = document.getElementById('btnEnter');
  var btnBackCreate = document.getElementById('btnBackCreate');
  var joinView = document.getElementById('joinView');
  var inputCode = document.getElementById('inputCode');
  var btnJoinGo = document.getElementById('btnJoinGo');
  var btnBackJoin = document.getElementById('btnBackJoin');
  var pendingCode = null;

  document.querySelectorAll('#sizeCard .size-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#sizeCard .size-btn').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      size = parseInt(b.getAttribute('data-size'), 10);
    });
  });

  function setStatus(m, cls) {
    status.textContent = m;
    status.className = 'status' + (cls ? ' status--' + cls : '');
  }
  function showMenu() { menuRow.hidden = false; createView.hidden = true; joinView.hidden = true; }
  function showCreate() { menuRow.hidden = true; createView.hidden = false; joinView.hidden = true; }
  function showJoin() { menuRow.hidden = true; createView.hidden = true; joinView.hidden = false; inputCode.focus(); }

  btnCreate.addEventListener('click', function () {
    setStatus('创建房间中…', 'connecting');
    fetch(WORKER + '/api/room?game=' + GAME + '&size=' + size, { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.code) throw new Error('未返回房间码');
        pendingCode = d.code;
        roomCode.textContent = d.code;
        btnEnter.href = 'go-play.html?mode=online&room=' + encodeURIComponent(d.code) + '&role=host&size=' + size;
        showCreate();
        setStatus('房间已创建，把房间码发给朋友', 'connected');
      })
      .catch(function (e) { setStatus('创建失败：' + (e && e.message ? e.message : e), 'disconnected'); });
  });

  btnJoin.addEventListener('click', function () { showJoin(); setStatus('输入朋友发来的房间码', 'connecting'); });

  function tryJoin() {
    var code = (inputCode.value || '').trim().toUpperCase();
    if (code.length !== 6) { setStatus('请输入 6 位房间码', 'disconnected'); return; }
    setStatus('加入房间中…', 'connecting');
    fetch(WORKER + '/api/room/' + code + '?game=' + GAME)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.state && !d.hasSpace) throw new Error('房间不存在');
        if (d.error === 'full' || d.error === 'started') throw new Error('房间已满或已开始');
        // 加入方沿用房主创建时的棋盘尺寸
        var sz = (d.state && d.state.size) ? d.state.size : size;
        location.href = 'go-play.html?mode=online&room=' + encodeURIComponent(code) + '&role=guest&size=' + sz;
      })
      .catch(function (e) { setStatus('加入失败：' + (e && e.message ? e.message : e), 'disconnected'); });
  }

  btnJoinGo.addEventListener('click', tryJoin);
  inputCode.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryJoin(); });

  btnCopy.addEventListener('click', function () {
    if (navigator.clipboard && pendingCode) navigator.clipboard.writeText(pendingCode).catch(function () {});
    setStatus('房间码已复制：' + pendingCode, 'connected');
  });

  btnBackCreate.addEventListener('click', showMenu);
  btnBackJoin.addEventListener('click', showMenu);

  showMenu();
})();
</script>
</body>
</html>
