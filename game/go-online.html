<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>围棋 · 互联网对战</title>
  <meta name="description" content="围棋 Go —— 创建或加入联机房间">
  <meta name="theme-color" content="#0a0e14">
  <link rel="stylesheet" href="style.css?v=b11">
</head>
<body>

<header class="head">
  <a href="go.html?v=b10" class="back">← 选择模式</a>
  <h1>互联网对战</h1>
</header>

<section class="start">
  <div class="start-inner">
    <h2 class="start-title">创建或加入房间</h2>

    <div class="online-panel">

      <!-- 围棋：棋盘尺寸（创建前选择，加入方沿用房主尺寸） -->
      <div class="card" id="sizeCard">
        <span class="cap">棋盘尺寸</span>
        <div class="size-pick inline">
          <button class="size-btn active" data-size="9" type="button">9 路</button>
          <button class="size-btn" data-size="13" type="button">13 路</button>
          <button class="size-btn" data-size="19" type="button">19 路</button>
        </div>
      </div>

      <!-- 初始：创建 / 加入 双卡片 -->
      <div class="lobby-choose" id="menuRow">
        <button class="lc-card create" id="btnCreate" type="button">
          <span class="lc-ico">🎮</span>
          <span class="lc-name">创建房间</span>
          <span class="lc-desc">新开一局，把房间码发给好友</span>
          <span class="lc-go">立即创建 →</span>
        </button>
        <button class="lc-card join" id="btnJoin" type="button">
          <span class="lc-ico">🔑</span>
          <span class="lc-name">加入房间</span>
          <span class="lc-desc">输入好友发来的 4 位房间码</span>
          <span class="lc-go">前往加入 →</span>
        </button>
      </div>

      <!-- 获取房间码中 -->
      <div class="lc-loading" id="creatingView">
        <span class="lc-spin"></span>
        <span>正在获取房间码…</span>
      </div>

      <!-- 加入：输入框 + 加入游戏（原逻辑） -->
      <div id="joinView" hidden>
        <span class="cap">输入 4 位房间码</span>
        <div class="join-row">
          <input id="inputCode" class="code-input" maxlength="4" placeholder="房间码" autocomplete="off" spellcheck="false" />
        </div>
        <div class="btn-row enter-row">
          <button id="btnJoinGo" class="btn on" type="button">进入房间</button>
        </div>
        <button class="back-link" id="btnBackJoin" type="button">← 返回</button>
      </div>

      <div class="status" id="status"></div>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';

  var WORKER = 'https://quoridor-mp.pages.dev';
  var GAME = 'go';
  var size = 9;

  var status = document.getElementById('status');
  var menuRow = document.getElementById('menuRow');
  var btnCreate = document.getElementById('btnCreate');
  var btnJoin = document.getElementById('btnJoin');
  var creatingView = document.getElementById('creatingView');
  var joinView = document.getElementById('joinView');
  var inputCode = document.getElementById('inputCode');
  var btnJoinGo = document.getElementById('btnJoinGo');
  var btnBackJoin = document.getElementById('btnBackJoin');
  var sizeCard = document.getElementById('sizeCard');

  document.querySelectorAll('#sizeCard .size-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#sizeCard .size-btn').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      size = parseInt(b.getAttribute('data-size'), 10);
    });
  });

  function setStatus(m, cls) {
    status.textContent = m;
    status.className = 'status' + (cls ? ' status--' + cls : '');
  }
  // 尺寸卡仅在初始/创建时显示；加入方隐藏（沿用房主尺寸）
  function showMenu() {
    if (sizeCard) sizeCard.hidden = false;
    menuRow.hidden = false;
    creatingView.classList.remove('show');
    joinView.hidden = true;
  }
  function showJoin() {
    if (sizeCard) sizeCard.hidden = true;
    menuRow.hidden = true;
    creatingView.classList.remove('show');
    joinView.hidden = false;
    inputCode.focus();
  }

  btnCreate.addEventListener('click', function () {
    menuRow.hidden = true;
    creatingView.classList.add('show');
    setStatus('申请房间码中…', 'connecting');
    fetch(WORKER + '/api/room?game=' + GAME + '&size=' + size, { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.code) throw new Error('未返回房间码');
        // 获取到房间码后直接进入房间（无需再点「进入游戏」）
        location.href = 'go-play.html?mode=online&room=' + encodeURIComponent(d.code) + '&role=host&size=' + size;
      })
      .catch(function (e) { showMenu(); setStatus('创建失败：' + (e && e.message ? e.message : e), 'disconnected'); });
  });

  btnJoin.addEventListener('click', function () { showJoin(); setStatus('输入朋友发来的房间码', 'connecting'); });

  function tryJoin() {
    var code = (inputCode.value || '').trim().toUpperCase();
    if (code.length !== 4) { setStatus('请输入 4 位房间码', 'disconnected'); return; }
    setStatus('加入房间中…', 'connecting');
    fetch(WORKER + '/api/room/' + code + '?game=' + GAME)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.state && !d.hasSpace) throw new Error('房间不存在');
        if (d.error === 'full' || d.error === 'started') throw new Error('房间已满或已开始');
        var sz = (d.state && d.state.size) ? d.state.size : size;
        location.href = 'go-play.html?mode=online&room=' + encodeURIComponent(code) + '&role=guest&size=' + sz;
      })
      .catch(function (e) { setStatus('加入失败：' + (e && e.message ? e.message : e), 'disconnected'); });
  }

  btnJoinGo.addEventListener('click', tryJoin);
  inputCode.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryJoin(); });

  btnBackJoin.addEventListener('click', showMenu);

  showMenu();
})();
</script>
  <script src="device.js?v=d1"></script>
</body>
</html>
