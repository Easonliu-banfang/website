<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>八球台球 · 互联网对战</title>
  <meta name="description" content="八球台球 8-Ball Pool —— 创建或加入联机房间">
  <meta name="theme-color" content="#0a0e14">
  <link rel="stylesheet" href="../style.css?v=b24">
</head>
<body>

<header class="head">
  <a href="../pool.html?v=b10" class="back">← 选择模式</a>
  <h1>互联网对战</h1>
</header>

<section class="start">
  <div class="start-inner">
    <h2 class="start-title">创建或加入房间</h2>

    <div class="online-panel">

      <!-- 初始：创建 / 加入 双卡片 -->
      <div class="lobby-choose" id="menuRow">
        <button class="lc-card create" id="btnCreate" type="button">
          <span class="lc-ico">🎮</span>
          <span class="lc-name">创建房间</span>
          <span class="lc-desc">新开一局，把 6 位房间码发给好友</span>
          <span class="lc-go">立即创建 →</span>
        </button>
        <button class="lc-card join" id="btnJoin" type="button">
          <span class="lc-ico">🔑</span>
          <span class="lc-name">加入房间</span>
          <span class="lc-desc">输入好友发来的 6 位房间码</span>
          <span class="lc-go">前往加入 →</span>
        </button>
      </div>

      <!-- 创建中 -->
      <div class="lc-loading" id="creatingView">
        <span class="lc-spin"></span>
        <span>正在创建房间…</span>
      </div>

      <!-- 创建成功：显示房间码，倒计时自动进入 -->
      <div id="roomView" hidden>
        <span class="cap">房间码</span>
        <div class="room-code-big" id="roomCode"></div>
        <p class="room-tip">把房间码发给好友，好友「加入房间」输入后即可开局。<br>双人一桌，创建者为先手（先开球）。</p>
        <div class="btn-row enter-row">
          <button id="btnCopy" class="btn ghost" type="button">复制房间链接</button>
          <button id="btnGoHost" class="btn on" type="button">立即进入游戏 →</button>
        </div>
        <p class="room-tip" id="countdownTip">3 秒后自动进入游戏…</p>
        <button class="back-link" id="btnBackRoom" type="button">← 返回</button>
      </div>

      <!-- 加入：输入框 + 进入游戏 -->
      <div id="joinView" hidden>
        <span class="cap">输入 6 位房间码</span>
        <div class="join-row">
          <input id="inputCode" class="code-input" maxlength="6" placeholder="房间码" autocomplete="off" spellcheck="false" inputmode="numeric" />
        </div>
        <div class="btn-row enter-row">
          <button id="btnJoinGo" class="btn on" type="button">进入游戏</button>
        </div>
        <button class="back-link" id="btnBackJoin" type="button">← 返回</button>
      </div>

      <div class="status" id="status"></div>
    </div>
  </div>
</section>

<script src="../device.js?v=d1"></script>
<script src="../auth-check.js?v=a2"></script>
<script>
(function () {
  'use strict';

  var WORKER = 'https://quoridor-mp.pages.dev';                    // 自有 Worker（房间注册）
  var RELAY = 'wss://quoridor-mp.pages.dev/api/nchan';             // 自有联机中继（对局数据）
  var HTTP_TIMEOUT = 12000;
  var AUTO_ENTER_SECONDS = 3;

  var status = document.getElementById('status');
  var menuRow = document.getElementById('menuRow');
  var btnCreate = document.getElementById('btnCreate');
  var btnJoin = document.getElementById('btnJoin');
  var creatingView = document.getElementById('creatingView');
  var roomView = document.getElementById('roomView');
  var roomCodeEl = document.getElementById('roomCode');
  var btnCopy = document.getElementById('btnCopy');
  var btnGoHost = document.getElementById('btnGoHost');
  var countdownTip = document.getElementById('countdownTip');
  var btnBackRoom = document.getElementById('btnBackRoom');
  var joinView = document.getElementById('joinView');
  var inputCode = document.getElementById('inputCode');
  var btnJoinGo = document.getElementById('btnJoinGo');
  var btnBackJoin = document.getElementById('btnBackJoin');

  var currentCode = null;
  var countdownTimer = null;

  function setStatus(m, cls) {
    status.textContent = m;
    status.className = 'status' + (cls ? ' status--' + cls : '');
  }
  function showMenu() {
    menuRow.hidden = false;
    creatingView.classList.remove('show');
    roomView.hidden = true;
    joinView.hidden = true;
  }
  function clearCountdown() {
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
  }

  // 带超时的 JSON 请求（照步步为营 online.js 的错误处理）
  function fetchJSON(url, opts) {
    return new Promise(function (resolve, reject) {
      var done = false;
      function finish(fn) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        fn();
      }
      var timer = setTimeout(function () {
        finish(function () { reject(new Error('连接超时。国内网络可能无法直连联机服务，可换个网络或开启代理后再试')); });
      }, HTTP_TIMEOUT);
      fetch(url, opts).then(function (r) {
        if (!r.ok) {
          r.json().then(
            function (d) { finish(function () { reject(new Error(d && d.error ? d.error : ('服务返回 ' + r.status))); }); },
            function () { finish(function () { reject(new Error('服务返回 ' + r.status)); }); }
          );
          return;
        }
        r.json().then(
          function (d) { finish(function () { resolve(d); }); },
          function () { finish(function () { reject(new Error('返回内容不是 JSON')); }); }
        );
      }, function () {
        finish(function () { reject(new Error('网络不可达。国内直连联机服务可能受限，可换个网络或开启代理后再试')); });
      });
    });
  }

  function getNick() {
    var auth = window.Auth && window.Auth.user;
    var n = null;
    if (auth) n = (typeof auth === 'string') ? auth : (auth.username || auth.name || auth.userName || null);
    if (!n) { try { n = localStorage.getItem('game_username'); } catch (e) {} }
    if (!n) n = '球友' + Math.floor(1000 + Math.random() * 9000);
    return n;
  }
  function getUid() {
    try {
      var u = localStorage.getItem('game_userid');
      if (!u) { u = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); localStorage.setItem('game_userid', u); }
      return u;
    } catch (e) { return 'p' + Date.now().toString(36); }
  }

  // 直接进入 3D 桌球对局（host 带 first=true 先手；guest 不带）
  function gameUrl(code, isHost) {
    return 'index.html?websocketserver=' + RELAY +
      '&userName=' + encodeURIComponent(getNick()) + '&userId=' + encodeURIComponent(getUid()) +
      '&ruletype=eightball&tableId=' + encodeURIComponent(code) +
      (isHost ? '&first=true' : '');
  }

  // ---- 创建：服务端注册房间 → 显示码 → 倒计时自动进入 ----
  btnCreate.addEventListener('click', function () {
    menuRow.hidden = true;
    creatingView.classList.add('show');
    roomView.hidden = true;
    setStatus('正在创建房间…', 'connecting');
    fetchJSON(WORKER + '/api/poolroom', { method: 'POST' })
      .then(function (d) {
        currentCode = d.code;
        roomCodeEl.textContent = currentCode;
        creatingView.classList.remove('show');
        roomView.hidden = false;
        setStatus('');
        startCountdown();
      })
      .catch(function (e) {
        creatingView.classList.remove('show');
        showMenu();
        setStatus('创建失败：' + (e && e.message ? e.message : e), 'disconnected');
      });
  });

  function startCountdown() {
    clearCountdown();
    var left = AUTO_ENTER_SECONDS;
    countdownTip.textContent = left + ' 秒后自动进入游戏…';
    countdownTimer = setInterval(function () {
      left--;
      if (left <= 0) {
        clearCountdown();
        goHost();
        return;
      }
      countdownTip.textContent = left + ' 秒后自动进入游戏…';
    }, 1000);
  }
  function goHost() {
    if (!currentCode) return;
    clearCountdown();
    location.href = gameUrl(currentCode, true);
  }
  btnGoHost.addEventListener('click', goHost);
  btnBackRoom.addEventListener('click', function () { clearCountdown(); showMenu(); });

  btnCopy.addEventListener('click', function () {
    if (!currentCode) return;
    var full = location.origin + location.pathname.replace(/room\.html$/, '') + gameUrl(currentCode, false);
    var done = function () { setStatus('已复制房间链接，发给好友即可', 'connected'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(full).then(done, function () { fallbackCopy(full); done(); });
    } else { fallbackCopy(full); done(); }
  });

  // ---- 加入：校验房间存在 → 占座 → 进入 ----
  btnJoin.addEventListener('click', function () {
    menuRow.hidden = true;
    creatingView.classList.remove('show');
    roomView.hidden = true;
    joinView.hidden = false;
    inputCode.focus();
    setStatus('输入朋友发来的 6 位房间码', 'connecting');
  });
  btnBackJoin.addEventListener('click', showMenu);

  function tryJoin() {
    var code = (inputCode.value || '').trim();
    if (!/^\d{6}$/.test(code)) { setStatus('请输入 6 位数字房间码', 'disconnected'); return; }
    setStatus('正在加入房间…', 'connecting');
    fetchJSON(WORKER + '/api/poolroom/' + code)
      .then(function (d) {
        if (!d.exists) { setStatus('房间不存在，请确认房间码', 'disconnected'); return; }
        if (d.full) { setStatus('房间已满', 'disconnected'); return; }
        // 占座：第 3 人会被服务端拒绝
        return fetchJSON(WORKER + '/api/poolroom/' + code, { method: 'POST' })
          .then(function () { location.href = gameUrl(code, false); });
      })
      .catch(function (e) {
        setStatus('加入失败：' + (e && e.message ? e.message : e), 'disconnected');
      });
  }
  btnJoinGo.addEventListener('click', tryJoin);
  inputCode.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryJoin(); });

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
})();
</script>
</body>
</html>
