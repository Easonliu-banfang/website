<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>八球台球 · 房间等待</title>
  <meta name="description" content="八球台球 8-Ball Pool —— 联机房间等待室">
  <meta name="theme-color" content="#0a0e14">
  <link rel="stylesheet" href="../style.css?v=b26">
</head>
<body>

<div id="lobby" class="lobby">
  <div class="room">
    <!-- 左：玩法预览 + 房间码 -->
    <div class="room-preview">
      <div class="room-art"><svg viewBox="0 0 240 168" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- 球桌 -->
          <rect x="34" y="22" width="172" height="124" rx="8" fill="#0f5132" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
          <rect x="46" y="34" width="148" height="100" rx="4" fill="#14663f" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
          <!-- 球袋 -->
          <circle cx="46" cy="34" r="5" fill="#000" opacity="0.85"/>
          <circle cx="120" cy="34" r="5" fill="#000" opacity="0.85"/>
          <circle cx="194" cy="34" r="5" fill="#000" opacity="0.85"/>
          <circle cx="46" cy="134" r="5" fill="#000" opacity="0.85"/>
          <circle cx="120" cy="134" r="5" fill="#000" opacity="0.85"/>
          <circle cx="194" cy="134" r="5" fill="#000" opacity="0.85"/>
          <!-- 三角摆球 -->
          <circle cx="152" cy="84" r="6" fill="#ffffff"/>
          <circle cx="140" cy="76" r="6" fill="#e63946"/>
          <circle cx="140" cy="92" r="6" fill="#2f6ff7"/>
          <circle cx="128" cy="68" r="6" fill="#f4a261"/>
          <circle cx="128" cy="84" r="6" fill="#000"/>
          <circle cx="128" cy="100" r="6" fill="#7f5539"/>
          <!-- 白球 -->
          <circle cx="78" cy="84" r="6" fill="#f8f9fa" stroke="rgba(0,0,0,0.35)" stroke-width="1"/>
          <!-- 球杆 -->
          <line x1="60" y1="110" x2="92" y2="92" stroke="#c8a45d" stroke-width="5" stroke-linecap="round"/>
          <line x1="60" y1="110" x2="86" y2="95" stroke="#f4e2b8" stroke-width="2" stroke-linecap="round"/>
        </svg></div>
      <div class="room-name">八球台球</div>
      <div class="room-code">房间 <b id="lobbyCode">----</b> <button id="btnShareLink" class="btn ghost btn-share" type="button"> 分享链接</button></div>
    </div>
    <!-- 右：席位 + 底部 -->
    <div class="room-main">
      <div class="room-caption">
        <span class="room-caption-title">等待玩家加入</span>
        <span class="room-status" id="lobbyStatus">连接中…</span>
      </div>
      <div class="room-seats">
        <div class="seat-card" id="seat0"><span class="seat-name">玩家 1</span><span class="seat-tag"></span><span class="seat-dot"></span></div>
        <div class="seat-card" id="seat1"><span class="seat-name">玩家 2</span><span class="seat-tag"></span><span class="seat-dot"></span></div>
        <div class="seat-card disabled" id="seat2"><span class="seat-name">未开放</span><span class="seat-tag"></span><span class="seat-dot"></span></div>
        <div class="seat-card disabled" id="seat3"><span class="seat-name">未开放</span><span class="seat-tag"></span><span class="seat-dot"></span></div>
      </div>
      <div class="room-foot">
        <div class="room-hint" id="lobbyHint"></div>
        <div class="room-btns">
          <button id="btnNotify" class="btn ghost" hidden>🔔 提醒准备</button>
          <button id="btnStart" class="btn on" disabled hidden>开始游戏</button>
          <button id="btnReady" class="btn on" hidden>准备</button>
          <button id="btnLeave" class="btn ghost">离开房间</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../notify.js?v=n3"></script>
<script src="online.js?v=p1"></script>
<script src="../lobby.js?v=l14"></script>
<script src="../device.js?v=d1"></script>
<script src="../auth-check.js?v=a2"></script>
<script>
(function () {
  'use strict';

  var WS_BASE = 'https://quoridor-mp.pages.dev';
  var WS_RELAY = 'wss://quoridor-mp.pages.dev/api/pool-ws';

  var params = new URLSearchParams(location.search);
  var ROOM = (params.get('room') || '').trim();
  var ROLE = (params.get('role') || 'guest').trim();   // host | guest

  function myName() {
    var auth = window.Auth && window.Auth.user;
    var n = null;
    if (auth) n = (typeof auth === 'string') ? auth : (auth.username || auth.name || auth.userName || null);
    if (!n) { try { n = localStorage.getItem('game_username'); } catch (e) {} }
    return (n || '你').slice(0, 12);
  }
  function getUid() {
    try {
      var u = localStorage.getItem('game_userid');
      if (!u) { u = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); localStorage.setItem('game_userid', u); }
      return u;
    } catch (e) { return 'p' + Date.now().toString(36); }
  }

  if (!ROOM || !/^\d{4,6}$/.test(ROOM)) {
    window.Notify && window.Notify.show('房间码无效，返回创建或加入', 'error', { sticky: true });
    setTimeout(function () { location.href = 'room.html?v=p1'; }, 1200);
    return;
  }

  var me = myName();
  var uid = getUid();
  var launched = false;

  var online = new window.PoolOnline();
  online.code = ROOM;

  var lobby = new window.GameLobby({
    game: 'pool',
    onReady: function () { if (online) online.sendReady(); },
    onStart: function () { if (online) online.sendStart(); },
    onNotify: function () {
      if (online) online.sendNotify();
      window.Notify && window.Notify.show('已提醒对方准备', 'info');
    },
    onLeave: function () {
      if (online) online.sendLeave();
      location.href = '../pool.html?v=b10';
    }
  });
  lobby.show(ROOM);
  lobby.setStatus('连接中…', 'connecting');

  function launchGame() {
    if (launched) return;
    launched = true;
    if (online) online.close();
    // 进入 3D 对局：自有 PoolRelay 中继实际对局；tableId 加 pl- 前缀避免跟其它游戏串房
    // ⚠️ first=true 只给 host——tailuge 的仲裁标志：
    //   guest(无first) 广播 BeginEvent → host 收到后 handleBegin 发 WatchEvent(球桌快照)
    //   → host 成先手开球方；guest 收 WatchEvent → handleWatch 成后手(WatchAim)。
    //   两边都不带或都带 first 会导致双方都进可开球状态 → 开球混乱。
    var tableId = 'pl-' + ROOM;
    location.href = 'index.html?v=p10&websocketserver=' + encodeURIComponent(WS_RELAY) +
      '&ruletype=eightball&tableId=' + encodeURIComponent(tableId) +
      '&userId=' + encodeURIComponent(uid) + '&userName=' + encodeURIComponent(me) +
      (ROLE === 'host' ? '&first=true' : '');
  }

  online.onStatus(function (phase, msg) {
    if (phase === 'connected') {
      lobby.setStatus('已连接，等待准备开始', 'ok');
    } else if (phase === 'reconnecting') {
      lobby.setStatus(msg || '连接中断，正在重连…');
      window.Notify && window.Notify.show(msg || '连接中断，正在重连…', 'warn', { sticky: true });
    } else if (phase === 'disconnected') {
      lobby.setStatus(msg || '连接已断开，请返回重试', 'err');
      window.Notify && window.Notify.show(msg || '连接已断开', 'error', { sticky: true });
    }
  });

  online.on('welcome', function () {
    lobby.setStatus('已连接，等待准备开始', 'ok');
  });
  online.on('lobby', function (d) {
    if (d.started) { launchGame(); return; }
    lobby.render(d);
  });
  online.on('started', launchGame);
  online.on('players', function () { /* lobby render 已覆盖状态更新 */ });
  online.on('notify', function () {
    window.Notify && window.Notify.show('🔔 房主提醒你准备', 'warn', { sticky: true });
  });
  online.on('dissolve', function () {
    window.Notify && window.Notify.show('房间已解散，即将返回…', 'error', { sticky: true });
    setTimeout(function () { location.href = '../pool.html?v=b10'; }, 1500);
  });
  online.on('giveup', function () {
    window.Notify && window.Notify.show('多次重连失败，返回大厅…', 'error', { sticky: true });
    setTimeout(function () { location.href = '../pool.html?v=b10'; }, 1500);
  });
  online.on('error', function (msg) {
    if (msg) window.Notify && window.Notify.show(String(msg), 'error');
  });

  online.connect(ROLE === 'host' ? 0 : 1).catch(function () {
    window.Notify && window.Notify.show('连接失败，正在重连…', 'warn', { sticky: true });
  });
})();
</script>
</body>
</html>
