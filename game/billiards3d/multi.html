  <body>
    <h1>多人联机测试页</h1>
    本地资源（开发用）
    <br />
    单人
    <ul>
      <li><a href="/">单人九球</a></li>
      <li>
        <a href="/?ruletype=threecushion">单人三库</a>
      </li>
      <li>
        <a href="/?ruletype=snooker">单人斯诺克</a>
      </li>
      <li>
        <a href="/?ruletype=eightball">单人八球</a>
      </li>
    </ul>
    双人
    <ul>
      <li>
        <a class="addwss" href="./2p.html?ruletype=nineball"
          >单窗口双人九球</a
        >
        （快速测试）
      </li>
      <li>
        <a class="addwss" href="./2p.html?ruletype=threecushion&raceTo=10"
          >单窗口双人三库</a
        >
      </li>
      <li>
        <a class="addwss" href="./2p.html?ruletype=snooker"
          >单窗口双人斯诺克</a
        >
      </li>
      <li>
        <a class="addwss" href="./2p.html?ruletype=eightball"
          >单窗口双人八球</a
        >
      </li>
    </ul>
  </body>

  <script>
    const urlParams = new URLSearchParams(window.location.search)
    const nonlocal = urlParams.has("nonlocal")
    const wss =
      window.location.hostname !== "localhost" || nonlocal
        ? "wss://billiards-network.onrender.com"
        : "ws://localhost"
    const shotClock = urlParams.get("shotClock")
    const wssparam = `websocketserver=${wss}`
    const elts = document.getElementsByClassName("addwss")
    for (const elt of elts) {
      let href = elt.href
      href += `&${wssparam}`
      if (shotClock) {
        href += `&shotClock=${shotClock}`
      }
      elt.href = href
    }
  </script>
