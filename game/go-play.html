<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>围棋 · Go</title>
  <meta name="description" content="围棋 Go —— 中国规则数子">
  <meta name="theme-color" content="#0a0e14">
  <link rel="stylesheet" href="style.css?v=b4">
</head>
<body>

<header class="head">
  <a href="go.html?v=b4" class="back">← 选择模式</a>
  <h1>围棋</h1>
  <span id="roomCodeTag" class="mode-tag" hidden></span>
  <span id="sizeTag" class="mode-tag" hidden></span>
</header>

<div class="layout">

  <div class="board-col">
    <div class="board-box">
      <div class="board-title" id="boardTitle">棋盘</div>
      <div class="board-frame">
        <canvas id="board"></canvas>
        <div id="banner" class="banner"></div>
      </div>
    </div>
  </div>

  <aside class="panel">

    <div class="card turn-card">
      <span class="cap">当前回合</span>
      <span class="turn-val p1" id="turnLabel">黑棋落子</span>
      <span class="phase-label" id="phaseLabel">对局进行中</span>
    </div>

    <!-- 棋盘尺寸已在「选择尺寸」页确定 -->

    <div class="card">
      <div class="btn-row">
        <button id="btnPass" class="btn" type="button">停一手</button>
        <button id="btnNew" class="btn ghost" type="button">新局</button>
      </div>
      <div class="meta">
        <span class="keys">交叉点落子 · P 停一手 · N 新局</span>
      </div>
    </div>

    <!-- 终局数子 -->
    <div class="card" id="scorePanel" hidden>
      <span class="cap">数子结果（中国规则）</span>
      <div id="scoreText" class="score-text"></div>
      <div class="btn-row">
        <button id="btnScore" class="btn on" type="button">确认数子</button>
        <button id="btnRescore" class="btn ghost" type="button">重判死子</button>
      </div>
    </div>

    <div class="status" id="onlineStatus" hidden></div>
  </aside>
</div>

<!-- 联机等待室 -->
<div id="lobby" class="lobby" hidden>
  <div class="lobby-card">
    <div class="lobby-head">
      <div class="lobby-room">房间 <b id="lobbyCode">----</b></div>
      <div id="lobbyStatus" class="lobby-status">连接中…</div>
    </div>
    <div class="lobby-seats">
      <div class="seat" id="seat0">
        <div class="seat-dot"></div>
        <div class="seat-name">玩家 1</div>
        <div class="seat-ready">未准备</div>
      </div>
      <div class="lobby-vs">VS</div>
      <div class="seat" id="seat1">
        <div class="seat-dot"></div>
        <div class="seat-name">玩家 2</div>
        <div class="seat-ready">未准备</div>
      </div>
    </div>
    <div class="lobby-actions">
      <button id="btnReady" class="btn on" type="button">准备</button>
      <button id="btnStart" class="btn" type="button" disabled>开始游戏</button>
    </div>
    <div class="lobby-actions">
      <button id="btnLeave" class="btn ghost" type="button">离开房间</button>
    </div>
    <div id="lobbyHint" class="lobby-hint"></div>
  </div>
</div>

<!-- 联机：对方请求重开确认 -->
<div id="reqModal" class="modal" hidden>
  <div class="modal-card">
    <p id="reqText" class="req-text">对方请求</p>
    <p id="reqSub" class="req-sub"></p>
    <div class="btn-row">
      <button id="btnReqOk" class="btn on" type="button">同意</button>
      <button id="btnReqNo" class="btn ghost" type="button">拒绝</button>
    </div>
  </div>
</div>

<script src="go-engine.js?v=g2"></script>
<script src="go-render.js?v=g2"></script>
<script src="go-ai.js?v=g2"></script>
<script src="go-online.js?v=g4"></script>
<script src="lobby.js?v=l1"></script>
<script src="go-app.js?v=g4"></script>
</body>
</html>
