<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>围棋 · Go</title>
  <meta name="description" content="围棋 Go —— 中国规则数子">
  <meta name="theme-color" content="#0a0e14">
  <link rel="stylesheet" href="style.css?v=b9">
</head>
<body>

<!-- 全局通知栏 -->
<div id="notifyBar" class="notify-bar" hidden></div>
>

<header class="head">
  <a href="go.html?v=b4" class="back">← 选择模式</a>
  <h1>围棋</h1>
  <span id="roomCodeTag" class="mode-tag" hidden></span>
  <span id="sizeTag" class="mode-tag" hidden></span>
</header>

<div class="layout">

  <div class="board-col">
    <div class="board-box">
      <div class="board-title" id="boardTitle">棋盘</div>
      <div class="board-frame">
        <canvas id="board"></canvas>
      </div>
    </div>
  </div>

  <aside class="panel">

    <!-- 计时（大赛规则） -->
    <div class="card timer-card" id="timerCard">
      <div class="timer-head">
        <span class="cap">计时（大赛规则）</span>
        <span class="timer-tag" id="timerTag">读秒 10 分 · 3×30 秒</span>
      </div>
      <div class="clock-row" id="clockRow" hidden>
        <div class="clock p1" id="clock0">
          <span class="clock-name" id="clockName0">黑</span>
          <span class="clock-time" id="clockTime0">10:00</span>
          <span class="clock-byo" id="clockByo0"></span>
        </div>
        <div class="clock p1" id="clock1">
          <span class="clock-name" id="clockName1">白</span>
          <span class="clock-time" id="clockTime1">10:00</span>
          <span class="clock-byo" id="clockByo1"></span>
        </div>
      </div>
      </div>

    <!-- 棋盘尺寸已在「选择尺寸」页确定 -->

    <div class="card">
      <div class="btn-row">
        <button id="btnUndo" class="btn ghost" type="button" disabled>悔棋</button>
        <button id="btnPass" class="btn" type="button">停一手</button>
        <button id="btnNew" class="btn ghost" type="button">新局</button>
      </div>
      <div class="meta">
        <span class="keys">交叉点落子 · P 停一手 · N 新局 · U 悔棋</span>
      </div>
    </div>

    <!-- 终局数子 -->
    <div class="card" id="scorePanel" hidden>
      <span class="cap">数子结果（中国规则）</span>
      <div id="scoreText" class="score-text"></div>
      <div class="btn-row">
        <button id="btnScore" class="btn on" type="button">确认数子</button>
        <button id="btnRescore" class="btn ghost" type="button">重判死子</button>
      </div>
    </div>
  </aside>
</div>

<!-- 联机等待室 -->

<div id="lobby" class="lobby" hidden>
  <div class="room">
    <div class="room-preview">
      <div class="room-art"><svg viewBox="0 0 240 168" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g stroke="rgba(255,255,255,0.10)" stroke-width="1">
            <line x1="54" y1="18" x2="54" y2="150"/><line x1="77" y1="18" x2="77" y2="150"/><line x1="100" y1="18" x2="100" y2="150"/><line x1="123" y1="18" x2="123" y2="150"/><line x1="146" y1="18" x2="146" y2="150"/><line x1="169" y1="18" x2="169" y2="150"/><line x1="192" y1="18" x2="192" y2="150"/>
            <line x1="54" y1="18" x2="192" y2="18"/><line x1="54" y1="41" x2="192" y2="41"/><line x1="54" y1="64" x2="192" y2="64"/><line x1="54" y1="87" x2="192" y2="87"/><line x1="54" y1="110" x2="192" y2="110"/><line x1="54" y1="133" x2="192" y2="133"/><line x1="54" y1="156" x2="192" y2="156"/>
          </g>
          <g fill="rgba(255,255,255,0.22)">
            <circle cx="100" cy="41" r="2.5"/><circle cx="146" cy="41" r="2.5"/><circle cx="100" cy="133" r="2.5"/><circle cx="146" cy="133" r="2.5"/><circle cx="123" cy="87" r="2.5"/>
          </g>
          <circle cx="100" cy="64" r="10" fill="#0a0e14" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
          <circle cx="123" cy="64" r="10" fill="#0a0e14" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
          <circle cx="100" cy="87" r="10" fill="#0a0e14" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
          <circle cx="123" cy="87" r="10" fill="#0a0e14" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
          <circle cx="146" cy="64" r="10" fill="#e6edf3" stroke="#0a0e14" stroke-width="1.5"/>
          <circle cx="169" cy="64" r="10" fill="#e6edf3" stroke="#0a0e14" stroke-width="1.5"/>
          <circle cx="146" cy="87" r="10" fill="#e6edf3" stroke="#0a0e14" stroke-width="1.5"/>
          <circle cx="169" cy="87" r="10" fill="#e6edf3" stroke="#0a0e14" stroke-width="1.5"/>
        </svg></div>
      <div class="room-name">围棋</div>
      <div class="room-code">房间 <b id="lobbyCode">----</b> <button id="btnShareLink" class="btn ghost btn-share" type="button">🔗 分享链接</button></div>
    </div>
    <div class="room-main">
      <div class="room-caption">
        <span class="room-caption-title">等待玩家加入</span>
        <span class="room-caption-sub" id="lobbyStatus">连接中…</span>
      </div>
      <div class="room-seats">
        <div class="seat-card" id="seat0"><span class="seat-name">玩家 1</span><span class="seat-dot"></span></div>
        <div class="seat-card" id="seat1"><span class="seat-name">玩家 2</span><span class="seat-dot"></span></div>
        <div class="seat-card disabled" id="seat2"><span class="seat-name">未开放</span><span class="seat-dot"></span></div>
        <div class="seat-card disabled" id="seat3"><span class="seat-name">未开放</span><span class="seat-dot"></span></div>
      </div>
      <div class="room-foot">
        <div class="room-hint" id="lobbyHint"></div>
        <div class="room-btns">
          <button id="btnNotify" class="btn ghost" hidden>🔔 提醒准备</button>
          <button id="btnStart" class="btn on" disabled hidden>开始游戏</button>
          <button id="btnReady" class="btn on" hidden>准备</button>
          <button id="btnLeave" class="btn ghost">离开房间</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 抛硬币：随机谁执黑（先手） -->
<div id="coinModal" class="modal coin-modal" hidden>
  <div class="coin-card">
    <p class="coin-title" id="coinTitle">随机先手</p>
    <div class="coin" id="coin"><span class="coin-face">🪙</span></div>
    <p class="coin-result" id="coinResult"></p>
    <p class="coin-sub" id="coinSub"></p>
  </div>
</div>

<div id="reqModal" class="modal" hidden>
  <div class="modal-card">
    <p id="reqText" class="req-text">对方请求</p>
    <p id="reqSub" class="req-sub"></p>
    <div class="btn-row">
      <button id="btnReqOk" class="btn on" type="button">同意</button>
      <button id="btnReqNo" class="btn ghost" type="button">拒绝</button>
    </div>
  </div>
</div>

<script src="go-engine.js?v=g2"></script>
<script src="go-render.js?v=g2"></script>
<script src="go-ai.js?v=g3"></script>
<script src="go-online.js?v=g9"></script>
<script src="lobby.js?v=l7"></script>
<script src="timer.js?v=t1"></script>
<script src="notify.js?v=n3"></script>
<script src="go-app.js?v=g19"></script>
  <script src="device.js?v=d1"></script>
</body>
</html>
