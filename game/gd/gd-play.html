<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>掼蛋 · 对局</title>
  <meta name="theme-color" content="#0a0e14">
  <link rel="stylesheet" href="../style.css?v=b24">
  <link rel="stylesheet" href="gd.css?v=g5">
</head>
<body>

<div id="notifyBar" class="notify-bar" hidden></div>

<div id="landscapeOverlay" hidden>
  <div class="lo-inner">
    <div class="lo-phone">📱</div>
    <h2>请横屏游玩</h2>
    <p>旋转你的手机到横向</p>
  </div>
</div>

<!-- 对局：原作者经典牌桌布局 -->
<div id="gameRoot" class="table-page" hidden>
  <div class="hudbar" id="hudbar">
    <div class="levels" id="hudLevels"></div>
    <div style="display:flex;align-items:center;gap:14px">
      <span style="color:#b9ac8f;font-size:13px" id="modeTagTxt"></span>
      <button class="btn small quit-btn" id="btnQuit">退出</button>
    </div>
  </div>
  <div class="table-board">
    <div class="seat top" id="seatTop"></div>
    <div class="seat left" id="seatLeft"></div>
    <div class="seat right" id="seatRight"></div>
    <div class="trick"><div class="trick-inner" id="trickInner"></div></div>
  </div>
  <div class="hand-area"><div class="hand" id="myHand"></div></div>
  <div class="actionbar" style="position:relative" id="actionbar">
    <div class="status" id="actStatus"></div>
    <button class="btn small" id="btnSort" type="button">按大小</button>
    <button class="btn" id="btnHint" type="button">提示</button>
    <button class="btn" id="btnPass" type="button" hidden>不要</button>
    <button class="btn primary" id="btnPlay" type="button">出牌</button>
    <button class="btn primary" id="btnNext" type="button" hidden>下一局</button>
  </div>
</div>

<!-- 牌型解释弹窗 -->
<div id="gdInterp" class="overlay" hidden>
  <div class="dialog">
    <h3>选择牌型</h3>
    <div class="hint">这组牌有多种解释，选一种打出</div>
    <div class="interp-list" id="interpList"></div>
  </div>
</div>

<!-- 贡/还贡弹窗 -->
<div id="gdModal" class="overlay" hidden>
  <div class="dialog">
    <h3 id="modalTitle">进贡</h3>
    <div class="hint" id="modalDesc"></div>
    <div class="interp-list" id="modalCards" style="flex-direction:row;flex-wrap:wrap;justify-content:center"></div>
  </div>
</div>

<!-- 结果弹窗 -->
<div id="gdResult" class="overlay" hidden>
  <div class="dialog" id="resultDialog"></div>
</div>

<div id="gdToast" class="toast" hidden></div>

<div id="lobby" class="lobby" hidden>
  <div class="room">
    <div class="room-preview">
      <div class="room-art"><svg viewBox="0 0 240 168" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g stroke="rgba(255,255,255,0.10)" stroke-width="1">
          <line x1="70" y1="30" x2="70" y2="84"/><line x1="70" y1="30" x2="170" y2="30"/><line x1="170" y1="30" x2="170" y2="84"/><line x1="70" y1="84" x2="170" y2="84"/>
        </g>
        <rect x="86" y="46" width="34" height="50" rx="8" fill="#e5484d"/>
        <text x="103" y="80" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">♠</text>
        <rect x="126" y="46" width="34" height="50" rx="8" fill="#3e8ef7"/>
        <text x="143" y="80" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">♥</text>
        <rect x="126" y="104" width="34" height="50" rx="8" fill="#2ebd59" transform="rotate(-8 143 129)"/>
        <text x="143" y="138" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">♦</text>
        <rect x="86" y="104" width="34" height="50" rx="8" fill="#f5c542"/>
        <text x="103" y="138" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">♣</text>
      </svg></div>
      <div class="room-name">掼蛋</div>
      <div class="room-code">房间 <b id="lobbyCode">----</b> <button id="btnShareLink" class="btn ghost btn-share" type="button"> 分享链接</button></div>
    </div>
    <div class="room-main">
      <div class="room-caption">
        <span class="room-caption-title">等待玩家加入</span>
        <span class="room-caption-sub" id="lobbyStatus">连接中…</span>
      </div>
      <div class="room-seats">
        <div class="seat-card" id="seat0"><span class="seat-name">玩家 1（下）</span><span class="seat-tag"></span><span class="seat-dot"></span></div>
        <div class="seat-card" id="seat1"><span class="seat-name">玩家 2（右）</span><span class="seat-tag"></span><span class="seat-dot"></span></div>
        <div class="seat-card" id="seat2"><span class="seat-name">玩家 3（上·队友）</span><span class="seat-tag"></span><span class="seat-dot"></span></div>
        <div class="seat-card" id="seat3"><span class="seat-name">玩家 4（左）</span><span class="seat-tag"></span><span class="seat-dot"></span></div>
      </div>
      <div class="room-foot">
        <div class="room-hint" id="lobbyHint"></div>
        <div class="room-btns">
          <button id="btnNotify" class="btn ghost" hidden>🔔 提醒准备</button>
          <button id="btnStart" class="btn on" disabled hidden>开始游戏</button>
          <button id="btnReady" class="btn on" hidden>准备</button>
          <button id="btnLeave" class="btn ghost">离开房间</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="gd-engine.js?v=g5"></script>
<script src="gd-online.js?v=g5"></script>
<script src="../lobby.js?v=l14"></script>
<script src="../notify.js?v=n3"></script>
<script src="gd-ai.js?v=g5"></script>
<script src="../bot.js?v=b3"></script>
<script src="gd-app.js?v=g5"></script>
  <script src="../device.js?v=d1"></script>
<script src="../auth-check.js?v=a2"></script>
</body>
</html>
