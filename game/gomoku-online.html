<html lang="zh-CN" data-page-node-id="F0CbYzJeI6vdXONT0UHwal">
<head data-page-node-id="7utDMugLC8FcZHlK5tAGWu">
  <meta charset="UTF-8" data-page-node-id="Vv2JiSDl7eRDGLvJ8J1UH6">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="IpoMUshJ9ZZeq9qYm853SR">
  <title>五子棋 · 互联网对战</title>
  <meta name="description" content="五子棋 Gomoku —— 创建或加入联机房间" data-page-node-id="X2pHiLkA1wo0o8cl1AIKWA">
  <meta name="theme-color" content="#0a0e14" data-page-node-id="jOgGIkAtdMkf24q1iGNv62">
  <link rel="stylesheet" href="style.css" data-page-node-id="NwGZIGVKuoA8yV8ersvL9v">
</head>
<body data-page-node-id="MGfCl6h3muCuuYCwlpTl4F">

<header class="head" data-page-node-id="H8PVpZEGk08Yb5LUTQ9z5M">
  <a href="gomoku.html?v=b2" class="back" data-page-node-id="N0ASSw9fIMdwmub83ZB5rq">← 选择模式</a>
  <h1 data-page-node-id="hG8RRVOfi7TkBn3QQPUSBD">互联网对战</h1>
</header>

<section class="start" data-page-node-id="AdQCEjsYZfAzMbulqy49EK">
  <div class="start-inner" data-page-node-id="AAesyFUezQlXysfEQmv9zD">
    <p class="start-sub" data-page-node-id="edXIOaICjcPyeN4qsfLw1z">和好友联机对决</p>
    <h2 class="start-title" data-page-node-id="kYHRdNazlVS3JN1T9Yknmd">创建或加入房间</h2>

    <div class="online-panel" data-page-node-id="dNeZOa9lkjE1diXBxVCbPu">

      <!-- 初始：两个入口 -->
      <div class="btn-row" id="menuRow" data-page-node-id="tdJfKKk13b5dS4SbLUIoO7">
        <button id="btnCreate" class="btn" type="button" data-page-node-id="T5fXhP4nFme0phY6i8lkK2">创建房间</button>
        <button id="btnJoin" class="btn" type="button" data-page-node-id="be4t57KCEr9RkclgbuAQ1K">加入房间</button>
      </div>

      <!-- 创建后：只显示房间码 + 进入游戏 -->
      <div id="createView" hidden data-page-node-id="v9BdstcdD1uGC0JOd7LnDd">
        <span class="cap" data-page-node-id="UWQy4G0zzNPgS75U4KdDhg">房间码（发给朋友）</span>
        <div class="code-box" data-page-node-id="h0lxqSWZzomTwHnQNhCreo">
          <b id="roomCode" data-page-node-id="HCNPULiuFDOJlgAVC0hIs7">------</b>
          <button id="btnCopy" class="btn ghost" type="button" data-page-node-id="K4ibbh98keM8oheRZq1Qg9">复制</button>
        </div>
        <div class="btn-row enter-row" data-page-node-id="g2fctVIFrsp8ZVksXX2V1g">
          <a id="btnEnter" class="btn on" href="#" data-page-node-id="Dl3DUexxUZ77TAsy4uS33q">进入游戏 →</a>
        </div>
        <button class="back-link" id="btnBackCreate" type="button" data-page-node-id="3rAIOYysUvp9EAtxc6s6gf">← 返回</button>
      </div>

      <!-- 加入：输入框 + 加入游戏 -->
      <div id="joinView" hidden data-page-node-id="BlyM9lADA9hXMoT3opPSJ0">
        <span class="cap" data-page-node-id="IDyrQ4hgzTSWxxXN6li15V">输入 6 位房间码</span>
        <div class="join-row" data-page-node-id="wdnjdHEAwc4KMNjOtlyyDu">
          <input id="inputCode" class="code-input" maxlength="6" placeholder="房间码" autocomplete="off" spellcheck="false" data-page-node-id="I68Euc5UmGKmXMEr1JHSYS" />
        </div>
        <div class="btn-row enter-row" data-page-node-id="0ytNnZG4zZkIBsl4Gln0Gi">
          <button id="btnJoinGo" class="btn on" type="button" data-page-node-id="xbZnv7uwgXBidUbw4bBemn">加入游戏</button>
        </div>
        <button class="back-link" id="btnBackJoin" type="button" data-page-node-id="bwDO370CsGQMawHF6oq4yY">← 返回</button>
      </div>

      <div class="status" id="status" data-page-node-id="cl8yjJdkALED1WkqpYaitN">未连接</div>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';

  var WORKER = 'https://quoridor-mp.pages.dev';
  var GAME = 'wm';

  var status = document.getElementById('status');
  var menuRow = document.getElementById('menuRow');
  var btnCreate = document.getElementById('btnCreate');
  var btnJoin = document.getElementById('btnJoin');
  var createView = document.getElementById('createView');
  var roomCode = document.getElementById('roomCode');
  var btnCopy = document.getElementById('btnCopy');
  var btnEnter = document.getElementById('btnEnter');
  var btnBackCreate = document.getElementById('btnBackCreate');
  var joinView = document.getElementById('joinView');
  var inputCode = document.getElementById('inputCode');
  var btnJoinGo = document.getElementById('btnJoinGo');
  var btnBackJoin = document.getElementById('btnBackJoin');
  var pendingCode = null;

  function setStatus(m, cls) {
    status.textContent = m;
    status.className = 'status' + (cls ? ' status--' + cls : '');
  }
  function showMenu() { menuRow.hidden = false; createView.hidden = true; joinView.hidden = true; }
  function showCreate() { menuRow.hidden = true; createView.hidden = false; joinView.hidden = true; }
  function showJoin() { menuRow.hidden = true; createView.hidden = true; joinView.hidden = false; inputCode.focus(); }

  btnCreate.addEventListener('click', function () {
    setStatus('创建房间中…', 'connecting');
    fetch(WORKER + '/api/room?game=' + GAME, { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.code) throw new Error('未返回房间码');
        pendingCode = d.code;
        roomCode.textContent = d.code;
        btnEnter.href = 'gomoku-play.html?mode=online&room=' + encodeURIComponent(d.code) + '&role=host';
        showCreate();
        setStatus('房间已创建，把房间码发给朋友', 'connected');
      })
      .catch(function (e) { setStatus('创建失败：' + (e && e.message ? e.message : e), 'disconnected'); });
  });

  btnJoin.addEventListener('click', function () { showJoin(); setStatus('输入朋友发来的房间码', 'connecting'); });

  function tryJoin() {
    var code = (inputCode.value || '').trim().toUpperCase();
    if (code.length !== 6) { setStatus('请输入 6 位房间码', 'disconnected'); return; }
    setStatus('加入房间中…', 'connecting');
    fetch(WORKER + '/api/room/' + code + '?game=' + GAME)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.state && !d.hasSpace) throw new Error('房间不存在');
        if (d.error === 'full' || d.error === 'started') throw new Error('房间已满或已开始');
        location.href = 'gomoku-play.html?mode=online&room=' + encodeURIComponent(code) + '&role=guest';
      })
      .catch(function (e) { setStatus('加入失败：' + (e && e.message ? e.message : e), 'disconnected'); });
  }

  btnJoinGo.addEventListener('click', tryJoin);
  inputCode.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryJoin(); });

  btnCopy.addEventListener('click', function () {
    if (navigator.clipboard && pendingCode) navigator.clipboard.writeText(pendingCode).catch(function () {});
    setStatus('房间码已复制：' + pendingCode, 'connected');
  });

  btnBackCreate.addEventListener('click', showMenu);
  btnBackJoin.addEventListener('click', showMenu);

  showMenu();
})();
</script>
</body>
</html>
