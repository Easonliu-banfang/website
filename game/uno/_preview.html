<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../style.css?v=b24">
<link rel="stylesheet" href="uno.css?v=u10">
<style>body{overflow:hidden}</style>
</head>
<body class="uno-play-body">
<div id="notifyBar" class="notify-bar" hidden></div>
<header class="head uno-head" id="topHeader"><a href="#" class="back">← 返回</a><h1 id="unoGameTitle">优诺UNO！</h1></header>
<section id="gameView" class="uno-table">

    <!-- ① 左上角计时区：卡通表盘 + 回合倒计时 -->
    <div class="uo-timer">
      <div class="uo-timer-icon">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="21" fill="#151c26" stroke="#22d3ee" stroke-width="3"/>
          <circle cx="24" cy="24" r="15" fill="none" stroke="rgba(34,211,238,.25)" stroke-width="1.5"/>
          <path d="M24 24 L24 14 M24 24 L31 28" stroke="#e5f6ff" stroke-width="3" stroke-linecap="round"/>
          <circle cx="24" cy="24" r="2.5" fill="#f5c542"/>
        </svg>
      </div>
      <div class="uo-timer-time" id="turnTimer">00:10</div>
      <div class="uo-game-clock">整局 <b id="gameTimer">04:00</b></div>
    </div>

    <!-- ② 中央游戏桌（椭圆卡通桌，玩家围坐） -->
    <div class="uo-table-disc">
      <div class="uo-rail"></div>

      <!-- A. 牌堆区域（中央左上偏中） -->
      <div class="uo-deck-zone">
        <button class="uo-deck uo-deck-disc" id="btnDraw" type="button" title="摸一张牌">
          <span class="uo-deck-inner" id="deckInner">摸牌</span>
          <span class="uo-deck-glow"></span>
          <span class="uo-deck-sub">🃏 牌堆</span>
        </button>
      </div>

      <!-- C. 中央方向/回合提示环（轨道自转；箭头独立不随轨道转） -->
      <div class="uo-dir-wrap">
        <div class="uo-dir-ring"></div>
        <span class="uo-dir-arrow" id="dirArrow">➤</span>
      </div>

      <!-- A2. 质疑 +4 按钮（被加人回合出现） -->
      <button class="uo-challenge-btn" id="btnChallenge" type="button" hidden>🤔 质疑 +4</button>

      <!-- B. 中央出牌区 -->
      <div class="uo-centerspot">
        <img id="topCardImg" class="uc uc-center" alt="当前牌">
      </div>

      <!-- 当前颜色 -->
      <div class="uo-colorzone">
        <span class="uo-colortag">当前颜色</span>
        <span class="uo-color-dot" id="colorDot"></span>
      </div>

      <!-- 效果横幅 -->
      <div class="uo-banner" id="banner"></div>
    </div>

    <!-- ③ 四周玩家（上 / 左 / 右，围绕圆桌） -->
    <div class="uo-player uo-p-top" id="playerTop"></div>
    <div class="uo-player uo-p-left" id="playerLeft"></div>
    <div class="uo-player uo-p-right" id="playerRight"></div>

    <!-- ④ 自己（底部偏左，黄色发光框标记） -->
    <div class="uo-me-zone">
      <div class="uo-me-avatar" id="meAvatar">👤</div>
      <div class="uo-me-name" id="meLabel">你</div>
    </div>

    <!-- ⑤ 左下快捷功能区 -->
    <div class="uo-quickbar">
      <button class="uq-btn" type="button" id="btnEmoji" title="快捷表情"><span class="uq-ico">😊</span><span class="uq-txt">表情</span></button>
      <button class="uq-btn" type="button" id="btnChat" title="对话"><span class="uq-ico">💬</span><span class="uq-txt">对话</span></button>
      <button class="uq-btn" type="button" id="btnVoice" title="语音控制"><span class="uq-ico">🎤</span><span class="uq-txt">语音</span></button>
    </div>

    <!-- ⑥ 自己手牌（底部中央，大尺寸重叠排列） -->
    <div class="uo-hand-zone">
      <div class="uo-hand" id="myHand"></div>
      <div class="uo-mate" id="mateRow" hidden>
        <span class="uo-mate-label" id="mateLabel">队友</span>
        <div class="uo-hand uo-hand--mate" id="mateHand"></div>
      </div>
      <button class="uo-pass-btn" id="btnPass" type="button" hidden>过</button>
    </div>

    <!-- ⑦ 右下角 UNO 大按钮 -->
    <button class="uo-uno-big" id="btnUno" type="button" hidden><span>UNO</span></button>

  </section>
<script>
var state = { you: 0, mode: 'ffa', capacity: 4, top: 'r7', topColor: 'r', turn: 1, dir: 1,
  nextDraw: 0, awaitColor: false, justDrew: false, challenge: false,
  counts: [7, 5, 4, 6], uno: [false, true, false, false], winner: -1,
  hand: ['r5','r3','bs','g7','w4','y2','r9','g5'] };
var me = 0;
var names = ['你','小明','AI-2','AI-3'];
var mode = 'ffa';
var el = {};
function $(id){ return document.getElementById(id); }
['playerTop','playerLeft','playerRight','topCardImg','colorDot','btnDraw','deckInner','dirArrow','banner','meLabel','meAvatar','btnUno','btnPass','myHand','mateRow','mateLabel','mateHand','turnTimer','gameTimer','btnChallenge'].forEach(function(id){ el[id]=$(id); });
function kindOf(c){ if(c==='w'||c==='w4') return 'w'; return c.charAt(0); }
function seatSpots(){ var cap=state?state.capacity:4, spots=[]; for(var s=0;s<Math.min(cap,4);s++) if(s!==me) spots.push(s); var posMap=['top','left','right']; var out=[]; for(var i=0;i<spots.length;i++) out.push({seat:spots[i],pos:posMap[i%3]}); return out; }
function oppCard(s){ var cnt=state?state.counts[s]:0; var isTurn=state&&state.turn===s; var uno=state&&state.uno&&state.uno[s];
  var name=(names&&names[s])?names[s]:('玩家 '+(s+1));
  var backs=''; for(var i=0;i<Math.min(cnt,12);i++) backs+='<div class="uo-back"></div>';
  var cntBadge=cnt>12?'<span class="uo-p-cnt">'+cnt+'</span>':'';
  return '<div class="uo-p-card'+(isTurn?' turn':'')+'"><div class="uo-p-avatar">👤</div><div class="uo-p-name">'+name+(uno?'<span class="uo-p-uno">UNO!</span>':'')+'</div>'+(isTurn?'<span class="uo-p-turn-tag">◆ 出牌中</span>':'')+'<div class="uo-p-hand">'+backs+cntBadge+'</div></div>'; }
function renderOpps(){ var t='',l='',r=''; seatSpots().forEach(function(it){ var c=oppCard(it.seat); if(it.pos==='top')t+=c; else if(it.pos==='left')l+=c; else r+=c; }); el.playerTop.innerHTML=t; el.playerLeft.innerHTML=l; el.playerRight.innerHTML=r; }
function renderBoard(){ el.topCardImg.src=('cards/'+(state.top.charAt(0).toUpperCase())+'R'+'.png'); el.topCardImg.style.display=''; el.colorDot.style.background={r:'#e5484d',b:'#3e8ef7',g:'#2ebd59',y:'#f5c542'}[state.topColor]; el.colorDot.textContent={r:'红',b:'蓝',g:'绿',y:'黄'}[state.topColor]; el.deckInner.textContent='摸牌'; el.banner.textContent='轮到你出牌'; el.banner.className='uo-banner mine'; el.turnTimer.textContent='00:08'; el.gameTimer.textContent='03:52'; }
function renderMe(){ var h=state.hand||[]; var html=''; var playable=['r5','r3','g5']; for(var i=0;i<h.length;i++){ var c=h[i]; var p=playable.indexOf(c)>=0; html+='<div class="uc-wrap'+(p?' ok':' no')+'" data-card="'+c+'"><img class="uc uc-hand'+(p?' glow':'')+'" src="cards/'+(c.charAt(0).toUpperCase())+(({s:'S',r:'R',d:'A2'})[c.slice(1)]||c.slice(1).toUpperCase())+'.png"></div>'; }
  el.myHand.innerHTML=html; el.myHand.classList.add('act'); el.meLabel.textContent='你'; el.meAvatar.textContent='👤';
  el.btnUno.hidden = !(h.length===1); }
renderOpps(); renderBoard(); renderMe();
</script>
</body>
</html>
