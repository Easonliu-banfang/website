<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>匹配卡牌 · 对局</title>
  <meta name="description" content="匹配卡牌（UNO 官方规则）—— 与你朋友实时对战">
  <meta name="theme-color" content="#0a0e14">
  <link rel="stylesheet" href="../style.css?v=b9">
  <link rel="stylesheet" href="uno.css?v=u2">
</head>
<body class="uno-play-body">

<!-- 全局通知栏 -->
<div id="notifyBar" class="notify-bar" hidden></div>

<!-- 竖屏遮罩：手机必须横屏才能玩 -->
<div id="landscapeOverlay" hidden>
  <div class="lo-inner">
    <div class="lo-phone">📱</div>
    <h2>请横屏游玩</h2>
    <p>旋转你的手机到横向</p>
  </div>
</div>

<header class="head uno-head" id="topHeader">
  <a href="uno.html?v=u2" class="back">← 选择模式</a>
  <h1>匹配卡牌</h1>
  <span id="roomCodeTag" class="mode-tag" hidden></span>
</header>

<div id="gameRoot" hidden>

  <!-- 对局画面 -->
  <section id="gameView" class="uno-table">

    <!-- 顶部：对手区（1~3 人；2v2 时对手两人一队显示） -->
    <div class="uo-opps" id="oppRow"></div>

    <!-- 中央区：顶牌 + 当前色 + 抽牌 -->
    <div class="uo-mid">
      <div class="uo-board">
        <div class="uo-topcard" id="topCardSlot">
          <img id="topCardImg" class="uc" alt="上一张">
        </div>
        <div class="uo-colorzone">
          <span class="uo-colortag">当前颜色</span>
          <span class="uo-color-dot" id="colorDot"></span>
        </div>
        <button class="uo-deck" id="btnDraw" type="button" title="摸一张牌">
          <span class="uo-deck-inner" id="deckInner">摸牌</span>
          <span class="uo-deck-sub">🃏 牌堆</span>
        </button>
      </div>

      <!-- 效果横幅 / 提示 -->
      <div class="uo-banner" id="banner"></div>
    </div>

    <!-- 底部：我自己（+ 2v2 队友） -->
    <div class="uo-me">
      <div class="uo-me-head">
        <span class="uo-me-label" id="meLabel">你</span>
        <button class="uo-uno-btn" id="btnUno" type="button" hidden>UNO!</button>
        <button class="uo-pass-btn" id="btnPass" type="button" hidden>过</button>
      </div>
      <div class="uo-hand" id="myHand"></div>
      <!-- 队友手牌（2v2，缩小只读） -->
      <div class="uo-mate" id="mateRow" hidden>
        <span class="uo-mate-label" id="mateLabel">队友</span>
        <div class="uo-hand uo-hand--mate" id="mateHand"></div>
      </div>
    </div>

  </section>
</div>

<!-- 联机等待室（与四款游戏统一：全屏房间页） -->
<div id="lobby" class="lobby" hidden>
  <div class="room">
    <div class="room-preview">
      <div class="room-art"><svg viewBox="0 0 240 168" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g stroke="rgba(255,255,255,0.10)" stroke-width="1">
            <line x1="70" y1="30" x2="70" y2="84"/><line x1="70" y1="30" x2="170" y2="30"/><line x1="170" y1="30" x2="170" y2="84"/><line x1="70" y1="84" x2="170" y2="84"/>
          </g>
          <rect x="86" y="46" width="34" height="50" rx="8" fill="#e5484d"/>
          <text x="103" y="80" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">7</text>
          <rect x="126" y="46" width="34" height="50" rx="8" fill="#3e8ef7"/>
          <text x="143" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">+2</text>
          <rect x="126" y="104" width="34" height="50" rx="8" fill="#2ebd59" transform="rotate(-8 143 129)"/>
          <text x="143" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">⏭</text>
          <rect x="86" y="104" width="34" height="50" rx="8" fill="#f5c542"/>
          <text x="103" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">🃏</text>
        </svg></div>
      <div class="room-name">匹配卡牌</div>
      <div class="room-code">房间 <b id="lobbyCode">----</b> <button id="btnShareLink" class="btn ghost btn-share" type="button">🔗 分享链接</button></div>
    </div>
    <div class="room-main">
      <div class="room-caption">
        <span class="room-caption-title">等待玩家加入</span>
        <span class="room-caption-sub" id="lobbyStatus">连接中…</span>
      </div>
      <div class="room-seats">
        <div class="seat-card" id="seat0"><span class="seat-name">玩家 1</span><span class="seat-tag"></span><span class="seat-dot"></span></div>
        <div class="seat-card" id="seat1"><span class="seat-name">玩家 2</span><span class="seat-tag"></span><span class="seat-dot"></span></div>
        <div class="seat-card disabled" id="seat2"><span class="seat-name">未开放</span><span class="seat-tag"></span><span class="seat-dot"></span></div>
        <div class="seat-card disabled" id="seat3"><span class="seat-name">未开放</span><span class="seat-tag"></span><span class="seat-dot"></span></div>
      </div>
      <div class="room-foot">
        <div class="room-hint" id="lobbyHint"></div>
        <div class="room-btns">
          <button id="btnNotify" class="btn ghost" hidden>🔔 提醒准备</button>
          <button id="btnStart" class="btn on" disabled hidden>开始游戏</button>
          <button id="btnReady" class="btn on" hidden>准备</button>
          <button id="btnLeave" class="btn ghost">离开房间</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 万色选色弹窗 -->
<div id="colorModal" class="modal" hidden>
  <div class="modal-card">
    <p class="req-text">选择颜色</p>
    <div class="uo-colorpick">
      <button class="cp cp-r" data-c="r">红</button>
      <button class="cp cp-b" data-c="b">蓝</button>
      <button class="cp cp-g" data-c="g">绿</button>
      <button class="cp cp-y" data-c="y">黄</button>
    </div>
  </div>
</div>

<!-- 结果横幅 -->
<div class="uo-result" id="resultBanner" hidden></div>

<script src="uno-engine.js?v=u2"></script>
<script src="uno-online.js?v=u2"></script>
<script src="../lobby.js?v=l8"></script>
<script src="../notify.js?v=n3"></script>
<script src="uno-app.js?v=u2"></script>
  <script src="../device.js?v=d1"></script>
</body>
</html>
