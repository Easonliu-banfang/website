<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>优诺UNO！ · 对局</title>
  <meta name="description" content="优诺UNO！（UNO 官方规则）—— 与你朋友实时对战">
  <meta name="theme-color" content="#0a0e14">
  <link rel="stylesheet" href="../style.css?v=b24">
<link rel="stylesheet" href="../result-overlay.css?v=ro2">
  <link rel="stylesheet" href="uno.css?v=u41">
<style>
/* 全屏加载遮罩（内嵌，避免外部 CSS 缓存导致纯文字） */
#loadingOverlay{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,14,24,0.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .5s ease}
#loadingOverlay.done{opacity:0;pointer-events:none}
#loadingOverlay .ul-orb{width:46px;height:46px;border-radius:50%;margin-bottom:22px;border:4px solid rgba(255,255,255,0.12);border-top-color:#e46c64;animation:ulSpin .9s linear infinite}
@keyframes ulSpin{to{transform:rotate(360deg)}}
#loadingOverlay .ul-title{font-size:17px;font-weight:700;color:rgba(240,246,255,0.95);letter-spacing:2px}
#loadingOverlay .ul-sub{font-size:13px;color:rgba(200,210,228,0.55);margin-top:6px;letter-spacing:1px}
#loadingOverlay .ul-bar{width:min(300px,62vw);height:7px;margin-top:26px;background:rgba(255,255,255,0.1);border-radius:99px;overflow:hidden}
#loadingOverlay .ul-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#e46c64,#f0a28a);border-radius:99px;transition:width .25s ease}
#loadingOverlay .ul-pct{margin-top:10px;font-size:13px;font-weight:700;color:rgba(240,246,255,0.9);font-variant-numeric:tabular-nums}
#loadingOverlay .ul-file{margin-top:6px;font-size:11px;color:rgba(200,210,228,0.5);max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
<style>
/* 背景层（内嵌，防外部 CSS 缓存） */
.uno-bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.uno-bg::before{content:"";position:absolute;inset:0;background:url('assets/uno-bg-wide.jpg') center bottom/cover no-repeat}
</style>
<style>
/* 选色弹窗（内嵌，防外部 CSS 缓存——与加载遮罩/背景同策略） */
#colorModal{position:fixed;inset:0;z-index:9990;display:flex;align-items:center;justify-content:center}
#colorModal[hidden]{display:none}
#colorModal .uno-cm-mask{position:absolute;inset:0;background:rgba(6,10,18,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:unoCmFade .22s ease both}
#colorModal .uno-cm-panel{position:relative;z-index:1;background:linear-gradient(180deg,#17233a,#0f1830);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:26px 30px 30px;box-shadow:0 30px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);animation:unoCmPop .28s cubic-bezier(.34,1.56,.64,1) both;transform-origin:center}
#colorModal.out .uno-cm-panel{animation:unoCmShrink .26s ease both}
@keyframes unoCmFade{from{opacity:0}to{opacity:1}}
@keyframes unoCmPop{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes unoCmShrink{from{transform:scale(1);opacity:1}to{transform:scale(.6);opacity:0}}
#colorModal .uno-cm-title{margin:0 0 18px;text-align:center;font-size:17px;font-weight:800;letter-spacing:3px;color:rgba(240,246,255,.95);text-shadow:0 2px 6px rgba(0,0,0,.5)}
#colorModal .uno-cm-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
#colorModal .uno-cm-chip{position:relative;width:92px;height:92px;border-radius:50%;border:none;cursor:pointer;padding:0;outline-offset:3px;background:radial-gradient(circle at 50% 26%,var(--clr-l) 0%,var(--clr) 46%,var(--clr-d) 100%);box-shadow:0 9px 0 var(--clr-d),0 16px 26px rgba(0,0,0,.45),inset 0 4px 8px rgba(255,255,255,.35),inset 0 -10px 16px rgba(0,0,0,.3);transition:transform .16s cubic-bezier(.34,1.56,.64,1),filter .16s ease;animation:unoCmIdle 2.6s ease-in-out infinite}
#colorModal .uno-cm-chip:nth-child(2){animation-delay:.32s}
#colorModal .uno-cm-chip:nth-child(3){animation-delay:.64s}
#colorModal .uno-cm-chip:nth-child(4){animation-delay:.96s}
@keyframes unoCmIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#colorModal .uno-cm-chip::before{content:"";position:absolute;left:50%;top:16%;width:52%;height:26%;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(255,255,255,.65),rgba(255,255,255,0) 70%);border-radius:50%;pointer-events:none}
#colorModal .uno-cm-chip .cm-ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:rgba(255,255,255,.92);text-shadow:0 2px 3px rgba(0,0,0,.4)}
#colorModal .uno-cm-chip:hover{transform:translateY(-6px) scale(1.06);filter:brightness(1.08)}
#colorModal .uno-cm-chip:active{transform:translateY(1px) scale(.96)}
#colorModal .uno-cm-chip.picked{animation:unoCmPick .5s ease both;z-index:2}
@keyframes unoCmPick{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1.02)}}
#colorModal .uno-cm-chip.picked::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--clr-l);animation:unoCmRing .6s ease-out both;pointer-events:none}
@keyframes unoCmRing{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.5);opacity:0}}
#colorModal .uno-cm-chip.flood{transition:background .5s ease,box-shadow .5s ease,transform .5s ease}
@media (max-width:680px){#colorModal .uno-cm-panel{padding:20px 22px 24px;border-radius:20px}#colorModal .uno-cm-chip{width:72px;height:72px}#colorModal .uno-cm-grid{gap:12px}}
/* 抽牌后「打出/不出」按钮：黄色圆角大白字（内嵌，防外部 CSS 缓存） */
#btnPlayDrawn,#btnPass{
  border:none;background:linear-gradient(180deg,#ffd23f,#f0a500);color:#fff;
  border-radius:16px;padding:9px 26px;font-size:15px;font-weight:900;letter-spacing:2px;
  box-shadow:0 5px 0 #a86f00,0 10px 18px rgba(80,50,0,.3);text-shadow:0 2px 3px rgba(90,55,0,.5);
  cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,opacity .12s ease,filter .12s ease;
}
#btnPlayDrawn:hover,#btnPass:hover{transform:translateY(-2px);filter:brightness(1.06)}
#btnPlayDrawn:active,#btnPass:active{transform:translateY(1px) scale(.97);box-shadow:0 1px 0 #a86f00}
#btnPlayDrawn.dim{
  background:linear-gradient(180deg,#8a8f98,#5d6269);box-shadow:0 5px 0 #3c4046,0 8px 14px rgba(0,0,0,.25);
  color:rgba(255,255,255,.75);text-shadow:none;cursor:not-allowed;
}
/* 牌堆按钮：双排大牌背无文字（内嵌，防缓存） */
#btnDraw{background:transparent;border:none;border-radius:0;padding:6px;min-width:0}
#btnDraw .uo-deck-inner{display:none}
.uo-deck-stack{height:86px;margin:0}
.uo-deck-back{width:54px;height:78px;margin-left:-27px;border-radius:9px;border:2px solid #fff;
  box-shadow:0 4px 10px rgba(20,40,70,.4);background-image:url('cards/back.png');background-size:100% 100%}
.uo-deck-back.under{top:8px}
.uo-deck-back:nth-child(1){transform:translate(-10px,2px) rotate(-8deg)}
.uo-deck-back:nth-child(2){transform:translate(10px,0px) rotate(8deg)}
.uo-deck-back.under:nth-child(3){transform:translate(-6px,10px) rotate(-3deg);z-index:0}
.uo-deck-back.under:nth-child(4){transform:translate(6px,12px) rotate(3deg);z-index:0}
/* 刚摸的牌可打上移高亮 + 其余锁定（内嵌，防缓存） */
.uc-wrap.drawn{transform:translateY(-26px)}
.uc-wrap.drawn .uc-hand.drawn-glow{box-shadow:0 0 18px rgba(255,200,60,.9),0 6px 16px rgba(0,0,0,.35);filter:brightness(1.08)}
.uc-wrap.locked{opacity:.45;filter:grayscale(.4);cursor:not-allowed}
.uc-wrap.locked .uc-hand{pointer-events:none}
.uo-pass-line{gap:14px;height:46px}
/* 质疑/接受 挑战按钮（内嵌，防缓存）：质疑红 / 接受黄 */
#challengeLine{margin-top:6px}
#btnChallenge{
  border:none;background:linear-gradient(180deg,#ff5f5f,#e03131);color:#fff;
  border-radius:16px;padding:9px 22px;font-size:14px;font-weight:900;letter-spacing:1px;
  box-shadow:0 5px 0 #9c1c1c,0 10px 18px rgba(120,20,20,.35);text-shadow:0 2px 3px rgba(80,10,10,.5);
  cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;
}
#btnChallenge:hover{transform:translateY(-2px);filter:brightness(1.06)}
#btnChallenge:active{transform:translateY(1px) scale(.97);box-shadow:0 1px 0 #9c1c1c}
#btnAccept{
  border:none;background:linear-gradient(180deg,#ffd23f,#f0a500);color:#fff;
  border-radius:16px;padding:9px 22px;font-size:14px;font-weight:900;letter-spacing:1px;
  box-shadow:0 5px 0 #a86f00,0 10px 18px rgba(80,50,0,.3);text-shadow:0 2px 3px rgba(90,55,0,.5);
  cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;
}
#btnAccept:hover{transform:translateY(-2px);filter:brightness(1.06)}
#btnAccept:active{transform:translateY(1px) scale(.97);box-shadow:0 1px 0 #a86f00}
</style>
</head>
<body class="uno-play-body">
<div class="uno-bg" aria-hidden="true"></div>

<!-- 全屏加载遮罩：素材下载中 -->
<div id="loadingOverlay" class="uno-loading">
  <div class="ul-orb"></div>
  <div class="ul-title">正在加载素材…</div>
  <div class="ul-sub">请耐心等待</div>
  <div class="ul-bar"><div class="ul-bar-fill" id="ulBar"></div></div>
  <div class="ul-pct" id="ulPct">0%</div>
  <div class="ul-file" id="ulFile">准备中…</div>
</div>

<!-- 全局通知栏 -->
<div id="notifyBar" class="notify-bar" hidden></div>

<!-- 竖屏遮罩：手机必须横屏才能玩 -->
<div id="landscapeOverlay" hidden>
  <div class="lo-inner">
    <div class="lo-phone">📱</div>
    <h2>请横屏游玩</h2>
    <p>旋转你的手机到横向</p>
  </div>
</div>

<header class="head uno-head" id="topHeader">
  <a href="uno.html?v=u6" class="back">← 返回</a>
  <h1 id="unoGameTitle">优诺UNO！</h1>
  <span id="roomCodeTag" class="mode-tag" hidden></span>
</header>

<div id="gameRoot" hidden>

  <!-- 围桌式对局画面 -->
  <section id="gameView" class="uno-table">

    <!-- ① 左上角计时区：卡通表盘 + 回合倒计时 -->
    <div class="uo-timer">
      <div class="uo-game-clock">总时长 <b id="gameTimer">03:00</b></div>
      <div class="uo-timer-time" id="turnTimer">00:10</div>
    </div>

    <!-- 时间到提示（整局 3 分钟到 → 全屏大字） -->
    <div id="timeUpOverlay" class="uno-timeup" hidden>
      <div class="uno-timeup-text">时间到！</div>
    </div>

    <!-- ② 中央游戏桌（椭圆卡通桌，玩家围坐） -->
    <div class="uo-table-disc">
      <div class="uo-rail"></div>

      <!-- A. 牌堆区域（中央左上偏中） -->
      <div class="uo-deck-zone">
        <button class="uo-deck uo-deck-disc" id="btnDraw" type="button" title="摸一张牌">
          <span class="uo-deck-stack">
            <img class="uo-deck-back" alt=""><img class="uo-deck-back" alt="">
            <img class="uo-deck-back under" alt=""><img class="uo-deck-back under" alt="">
          </span>
          <span class="uo-deck-glow"></span>
        </button>
      </div>


      <!-- A2. 质疑 +4 按钮（被加人回合出现） -->
      <button class="uo-challenge-btn" id="btnChallenge" type="button" hidden>🤔 质疑 +4</button>

      <!-- B. 中央出牌区 -->
      <div class="uo-centerspot">
        <img id="topCardImg" class="uc uc-center" alt="当前牌">
      </div>


      <!-- 效果横幅 -->
      <div class="uo-banner" id="banner"></div>
    </div>

    <!-- ③ 四周玩家（上 / 左 / 右，围绕圆桌） -->
    <div class="uo-player uo-p-top" id="playerTop"></div>
    <div class="uo-player uo-p-left" id="playerLeft"></div>
    <div class="uo-player uo-p-right" id="playerRight"></div>

    <!-- ④ 自己（底部偏左，黄色发光框标记） -->
    <div class="uo-me-zone">
      <div class="uo-me-avatar" id="meAvatar"></div>
      <div class="uo-me-name" id="meLabel">你</div>
    </div>

    <!-- ⑤ 快捷功能区（对话，左侧中间偏上） -->
    <div class="uo-quickbar">
      <button class="uq-btn" type="button" id="btnChat" title="对话"><span class="uq-ico">💬</span><span class="uq-txt">对话</span></button>
    </div>

    <!-- ⑥ 自己手牌（底部中央，大尺寸重叠排列） -->
    <div class="uo-hand-zone">
      <div class="uo-pass-line" id="passLine">
        <button class="uo-pass-btn" id="btnPlayDrawn" type="button" hidden>打出</button>
        <button class="uo-pass-btn" id="btnPass" type="button" hidden>不出</button>
      </div>
      <div class="uo-pass-line" id="challengeLine" hidden>
        <button class="uo-pass-btn ch-alert" id="btnChallenge" type="button">质疑（失败+8）</button>
        <button class="uo-pass-btn" id="btnAccept" type="button">接受（+4）</button>
      </div>
      <div class="uo-mate" id="mateRow" hidden>
        <span class="uo-mate-label" id="mateLabel">队友</span>
        <div class="uo-hand uo-hand--mate" id="mateHand"></div>
      </div>
      <div class="uo-hand" id="myHand"></div>
    </div>

    <!-- ⑦ 右下角 UNO 大按钮 -->
    <button class="uo-uno-big" id="btnUno" type="button" aria-label="喊 UNO"></button>

  </section>
</div>

<!-- 联机等待室（与四款游戏统一：全屏房间页） -->
<div id="lobby" class="lobby" hidden>
  <div class="room">
    <div class="room-preview">
      <div class="room-art"><svg viewBox="0 0 240 168" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g stroke="rgba(255,255,255,0.10)" stroke-width="1">
            <line x1="70" y1="30" x2="70" y2="84"/><line x1="70" y1="30" x2="170" y2="30"/><line x1="170" y1="30" x2="170" y2="84"/><line x1="70" y1="84" x2="170" y2="84"/>
          </g>
          <rect x="86" y="46" width="34" height="50" rx="8" fill="#e5484d"/>
          <text x="103" y="80" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">7</text>
          <rect x="126" y="46" width="34" height="50" rx="8" fill="#3e8ef7"/>
          <text x="143" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">+2</text>
          <rect x="126" y="104" width="34" height="50" rx="8" fill="#2ebd59" transform="rotate(-8 143 129)"/>
          <text x="143" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">⏭</text>
          <rect x="86" y="104" width="34" height="50" rx="8" fill="#f5c542"/>
          <text x="103" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">🃏</text>
        </svg></div>
      <div class="room-name">优诺UNO！</div>
      <div class="room-code">房间 <b id="lobbyCode">----</b> <button id="btnShareLink" class="btn ghost btn-share" type="button"> 分享链接</button></div>
    </div>
    <div class="room-main">
      <div class="room-caption">
        <span class="room-caption-title">等待玩家加入</span>
        <span class="room-caption-sub" id="lobbyStatus">连接中…</span>
      </div>
      <div class="room-seats">
        <div class="seat-card" id="seat0"><span class="seat-name">玩家 1</span><span class="seat-tag"></span><span class="seat-dot"></span></div>
        <div class="seat-card" id="seat1"><span class="seat-name">玩家 2</span><span class="seat-tag"></span><span class="seat-dot"></span></div>
        <div class="seat-card disabled" id="seat2"><span class="seat-name">未开放</span><span class="seat-tag"></span><span class="seat-dot"></span></div>
        <div class="seat-card disabled" id="seat3"><span class="seat-name">未开放</span><span class="seat-tag"></span><span class="seat-dot"></span></div>
      </div>
      <div class="room-foot">
        <div class="room-hint" id="lobbyHint"></div>
        <div class="room-btns">
          <button id="btnNotify" class="btn ghost" hidden>🔔 提醒准备</button>
          <button id="btnStart" class="btn on" disabled hidden>开始游戏</button>
          <button id="btnReady" class="btn on" hidden>准备</button>
          <button id="btnLeave" class="btn ghost">离开房间</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 万色选色弹窗（UNO 官方风格：2×2 立体圆形色块） -->
<div id="colorModal" class="uno-cm" hidden>
  <div class="uno-cm-mask"></div>
  <div class="uno-cm-panel">
    <p class="uno-cm-title">选择颜色</p>
    <div class="uno-cm-grid">
      <button class="uno-cm-chip" data-c="r" style="--clr:#e11737;--clr-d:#8f0d24;--clr-l:#ff6d7e">
        <span class="cm-ico">红</span>
      </button>
      <button class="uno-cm-chip" data-c="b" style="--clr:#1e6fff;--clr-d:#12419b;--clr-l:#7ab0ff">
        <span class="cm-ico">蓝</span>
      </button>
      <button class="uno-cm-chip" data-c="g" style="--clr:#28a745;--clr-d:#15612a;--clr-l:#6fd98b">
        <span class="cm-ico">绿</span>
      </button>
      <button class="uno-cm-chip" data-c="y" style="--clr:#f4b400;--clr-d:#9a6f00;--clr-l:#ffe066">
        <span class="cm-ico">黄</span>
      </button>
    </div>
  </div>
</div>

<!-- 结果横幅 -->
<div class="uo-result" id="resultBanner" hidden></div>

<script src="uno-online.js?v=u8"></script>

</body>
</html>
