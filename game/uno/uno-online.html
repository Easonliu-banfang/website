<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>匹配卡牌 · 互联网对战</title>
  <meta name="description" content="匹配卡牌 UNO —— 创建或加入联机房间">
  <meta name="theme-color" content="#0a0e14">
  <link rel="stylesheet" href="../style.css?v=b9">
  <link rel="stylesheet" href="uno.css?v=u1">
</head>
<body>

<header class="head">
  <a href="uno.html?v=u1" class="back">← 选择模式</a>
  <h1>互联网对战</h1>
  <span class="mode-tag" id="modeTag">--</span>
</header>

<section class="start">
  <div class="start-inner">
    <p class="start-sub">和好友联机一局</p>
    <h2 class="start-title">创建或加入房间</h2>

    <div class="online-panel">

      <div class="btn-row" id="menuRow">
        <button id="btnCreate" class="btn" type="button">创建房间</button>
        <button id="btnJoin" class="btn" type="button">加入房间</button>
      </div>

      <div id="createView" hidden>
        <span class="cap">房间码（发给朋友）</span>
        <div class="code-box">
          <b id="roomCode">------</b>
          <button id="btnCopy" class="btn ghost" type="button">复制</button>
          <button id="btnShare" class="btn ghost" type="button">🔗 复制分享链接</button>
        </div>
        <div class="seats" id="seatRow" hidden></div>
        <div class="btn-row enter-row">
          <a id="btnEnter" class="btn on" href="#">进入游戏 →</a>
        </div>
        <button class="back-link" id="btnBackCreate" type="button">← 返回</button>
      </div>

      <div id="joinView" hidden>
        <span class="cap">输入 4 位房间码</span>
        <div class="join-row">
          <input id="inputCode" class="code-input" maxlength="4" placeholder="房间码" autocomplete="off" spellcheck="false" />
        </div>
        <div class="btn-row enter-row">
          <button id="btnJoinGo" class="btn on" type="button">加入游戏</button>
        </div>
        <button class="back-link" id="btnBackJoin" type="button">← 返回</button>
      </div>

      <div class="status" id="status">未连接</div>
    </div>
  </div>
</section>

<script src="uno-online.js?v=u1"></script>
<script>
(function () {
  'use strict';

  // 从 URL 读取模式（quoridor 大厅沿用：?mode=2|3|4|2v2）
  var params = new URLSearchParams(location.search);
  var mode = params.get('mode') || '2';
  var MODE_LABEL = { '2': '双人', '3': '三人', '4': '四人', '2v2': '2v2 组队' };
  document.getElementById('modeTag').textContent = MODE_LABEL[mode] || '双人';

  var status = document.getElementById('status');
  var menuRow = document.getElementById('menuRow');
  var btnCreate = document.getElementById('btnCreate');
  var btnJoin = document.getElementById('btnJoin');
  var createView = document.getElementById('createView');
  var roomCode = document.getElementById('roomCode');
  var btnCopy = document.getElementById('btnCopy');
  var btnEnter = document.getElementById('btnEnter');
  var btnBackCreate = document.getElementById('btnBackCreate');
  var joinView = document.getElementById('joinView');
  var inputCode = document.getElementById('inputCode');
  var btnJoinGo = document.getElementById('btnJoinGo');
  var btnBackJoin = document.getElementById('btnBackJoin');
  var seatRow = document.getElementById('seatRow');

  var o = new window.UnoOnline();
  var pendingCode = null;

  function setStatus(m, cls) {
    status.textContent = m;
    status.className = 'status' + (cls ? ' status--' + cls : '');
  }

  function showMenu() { menuRow.hidden = false; createView.hidden = true; joinView.hidden = true; }
  function showCreate() { menuRow.hidden = true; createView.hidden = false; joinView.hidden = true; }
  function showJoin() { menuRow.hidden = true; createView.hidden = true; joinView.hidden = false; inputCode.focus(); }

  // 座位预演（上下两排一队的提示，符合 2v2 组队观感）
  function renderSeats(m) {
    seatRow.innerHTML = '';
    if (m === '2v2') {
      var rows = [
        { cls: 'seat top', label: '上面一队', n: ['1', '2'] },
        { cls: 'seat bottom', label: '下面一队', n: ['3', '4'] },
      ];
      rows.forEach(function (r) {
        var el = document.createElement('div');
        el.className = 'seat-row';
        r.n.forEach(function () {
          var s = document.createElement('span');
          s.className = r.cls;
          el.appendChild(s);
        });
        var tag = document.createElement('span');
        tag.className = 'seat-tag';
        tag.textContent = r.label + ' ' + r.n.join(' / ');
        el.appendChild(tag);
        seatRow.appendChild(el);
      });
      seatRow.hidden = false;
    } else {
      seatRow.hidden = true;
    }
  }

  btnCreate.addEventListener('click', function () {
    setStatus('创建房间中…', 'connecting');
    o.createRoom(mode).then(function (code) {
      pendingCode = code;
      roomCode.textContent = code;
      btnEnter.href = 'uno-play.html?mode=online&room=' + encodeURIComponent(code) + '&role=host&gm=' + encodeURIComponent(mode);
      renderSeats(mode);
      showCreate();
      setStatus('房间已创建，把房间码发给朋友', 'connected');
    }).catch(function (e) {
      setStatus('创建失败：' + (e && e.message ? e.message : e), 'disconnected');
    });
  });

  btnJoin.addEventListener('click', function () {
    showJoin();
    setStatus('输入朋友发来的房间码', 'connecting');
  });

  function tryJoin() {
    var code = (inputCode.value || '').trim().toUpperCase();
    if (code.length !== 4) { setStatus('请输入 4 位房间码', 'disconnected'); return; }
    setStatus('加入房间中…', 'connecting');
    o.joinRoom(code).then(function () {
      location.href = 'uno-play.html?mode=online&room=' + encodeURIComponent(code) + '&role=guest&gm=' + encodeURIComponent(mode);
    }).catch(function (e) {
      setStatus('加入失败：' + (e && e.message ? e.message : e), 'disconnected');
    });
  }

  btnJoinGo.addEventListener('click', tryJoin);
  inputCode.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryJoin(); });

  btnCopy.addEventListener('click', function () {
    if (navigator.clipboard && pendingCode) navigator.clipboard.writeText(pendingCode).catch(function () {});
    setStatus('房间码已复制：' + pendingCode, 'connected');
  });
  var btnShare = document.getElementById('btnShare');
  if (btnShare) btnShare.addEventListener('click', function () {
    if (!pendingCode) return;
    var shareUrl = location.origin + location.pathname.replace('uno-online.html', 'uno-play.html') +
      '?mode=online&room=' + encodeURIComponent(pendingCode) + '&role=guest&gm=' + encodeURIComponent(mode);
    copyShare(shareUrl);
  });
  function copyShare(url) {
    function done() { setStatus('分享链接已复制，发给朋友即可直接加入', 'connected'); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done).catch(function () { fallbackCopy(url); done(); });
    else { fallbackCopy(url); done(); }
  }
  function fallbackCopy(url) {
    var ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta);
  }

  btnBackCreate.addEventListener('click', showMenu);
  btnBackJoin.addEventListener('click', showMenu);

  showMenu();
})();
</script>
  <script src="../device.js?v=d1"></script>
</body>
</html>
