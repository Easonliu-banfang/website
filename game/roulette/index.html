<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>🧟 恶魔轮盘 · 3D</title>
<meta name="description" content="恶魔轮盘 —— 一艘漆黑地下室的霰弹枪俄罗斯轮盘，与恶魔对赌性命" />
<meta name="theme-color" content="#0a0a0f">
<link rel="stylesheet" href="style.css?v=r12">
<link rel="stylesheet" href="../result-overlay.css?v=ro2">
</head>
<body class="roulette-body">

<div id="app">
  <div id="introScreen" class="intro-screen">
    <div class="intro-card">
      <div class="intro-title">🎰 <span>恶魔轮盘</span></div>
      <div class="intro-sub">一把装不满的霰弹枪 · 八种致命道具 · 与恶魔对赌性命</div>
      <button id="btnStart" class="btn-main">入 局</button>
      <div class="intro-note">先梭一把 —— 记得选对是射自己还是射它</div>
    </div>
  </div>
  <canvas id="stage"></canvas>
  <div class="hud hidden" id="hud">
    <div class="hud-top">
      <div class="hud-player me">
        <div class="hud-name">你</div>
        <div class="hud-lives" id="myLives"></div>
      </div>
      <div class="hud-gun">
        <div class="hud-shells" id="shellStatus">装弹中…</div>
      </div>
      <div class="hud-player foe">
        <div class="hud-lives" id="foeLives"></div>
        <div class="hud-name">恶魔</div>
      </div>
    </div>
    <div class="hud-actions hidden" id="actionBar"></div>
  </div>
</div>

<script type="module" src="src/main.js?v=r12"></script>
</body>
</html>
