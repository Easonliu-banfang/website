<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>步步为营 · Quoridor</title>
  <meta name="description" content="Quoridor 步步为营 —— 走到对面，或者把对手堵死">
  <meta name="theme-color" content="#0a0e14">
  <link rel="stylesheet" href="style.css?v=b9">
</head>
<body>

<!-- 全局通知栏 -->
<div id="notifyBar" class="notify-bar" hidden></div>
>

<header class="head">
  <a href="quoridor.html?v=b4" class="back">← 选择模式</a>
  <h1>步步为营</h1>
  <span id="roomCodeTag" class="mode-tag" hidden></span>
</header>

<div class="layout">

  <div class="board-col">
    <div class="board-box">
      <canvas id="board"></canvas>
    </div>
  </div>

  <aside class="panel">

    <div class="card">
      <span class="cap">剩余墙数</span>
      <div class="player p0">
        <span class="dot"></span>
        <span class="pname">玩家一</span>
        <span class="pwall"><b id="w1">10</b> 面</span>
      </div>
      <div class="player p1">
        <span class="dot"></span>
        <span class="pname"><span id="p2name">电脑</span></span>
        <span class="pwall"><b id="w2">10</b> 面</span>
      </div>
    </div>

    <div class="card">
      <span class="cap">这一步做什么</span>
      <div class="btn-row">
        <button id="btnMove" class="btn on" type="button">走子</button>
        <button id="btnWall" class="btn" type="button">放墙</button>
      </div>
    </div>

    <div class="card">
      <div class="btn-row">
        <button id="btnUndo" class="btn ghost" type="button">悔棋</button>
        <button id="btnNew" class="btn ghost" type="button">新局</button>
      </div>
      <div class="meta">
        第 <b id="stepCount">0</b> 回合
        <span class="keys">W 切墙 · U 悔棋 · N 新局</span>
      </div>
    </div>
  </aside>
</div>

<!-- 联机等待室 -->

<div id="lobby" class="lobby" hidden>
  <div class="room">
    <div class="room-preview">
      <div class="room-art"><svg viewBox="0 0 240 168" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g stroke="rgba(255,255,255,0.10)" stroke-width="1">
            <line x1="54" y1="18" x2="54" y2="150"/><line x1="80" y1="18" x2="80" y2="150"/><line x1="106" y1="18" x2="106" y2="150"/><line x1="133" y1="18" x2="133" y2="150"/><line x1="159" y1="18" x2="159" y2="150"/><line x1="186" y1="18" x2="186" y2="150"/>
            <line x1="54" y1="18" x2="186" y2="18"/><line x1="54" y1="44" x2="186" y2="44"/><line x1="54" y1="70" x2="186" y2="70"/><line x1="54" y1="97" x2="186" y2="97"/><line x1="54" y1="123" x2="186" y2="123"/><line x1="54" y1="150" x2="186" y2="150"/>
          </g>
          <rect x="119" y="44" width="9" height="53" rx="3" fill="#a78bfa" opacity="0.85"/>
          <circle cx="106" cy="70" r="12" fill="#22d3ee"/>
          <circle cx="106" cy="70" r="12" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
        </svg></div>
      <div class="room-name">步步为营</div>
      <div class="room-code">房间 <b id="lobbyCode">----</b> <button id="btnShareLink" class="btn ghost btn-share" type="button">🔗 分享链接</button></div>
    </div>
    <div class="room-main">
      <div class="room-caption">
        <span class="room-caption-title">等待玩家加入</span>
        <span class="room-caption-sub" id="lobbyStatus">连接中…</span>
      </div>
      <div class="room-seats">
        <div class="seat-card" id="seat0"><span class="seat-name">玩家 1</span><span class="seat-dot"></span></div>
        <div class="seat-card" id="seat1"><span class="seat-name">玩家 2</span><span class="seat-dot"></span></div>
        <div class="seat-card disabled" id="seat2"><span class="seat-name">未开放</span><span class="seat-dot"></span></div>
        <div class="seat-card disabled" id="seat3"><span class="seat-name">未开放</span><span class="seat-dot"></span></div>
      </div>
      <div class="room-foot">
        <div class="room-hint" id="lobbyHint"></div>
        <div class="room-btns">
          <button id="btnNotify" class="btn ghost" hidden>🔔 提醒准备</button>
          <button id="btnStart" class="btn on" disabled hidden>开始游戏</button>
          <button id="btnReady" class="btn on" hidden>准备</button>
          <button id="btnLeave" class="btn ghost">离开房间</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 抛硬币：随机谁执黑（先手） -->
<div id="coinModal" class="modal coin-modal" hidden>
  <div class="coin-card">
    <p class="coin-title" id="coinTitle">随机先手</p>
    <div class="coin" id="coin"><span class="coin-face">🪙</span></div>
    <p class="coin-result" id="coinResult"></p>
    <p class="coin-sub" id="coinSub"></p>
  </div>
</div>

<div id="reqModal" class="modal" hidden>
  <div class="modal-card">
    <p id="reqText" class="req-text">对方请求</p>
    <p id="reqSub" class="req-sub"></p>
    <div class="btn-row">
      <button id="btnReqOk" class="btn on" type="button">同意</button>
      <button id="btnReqNo" class="btn ghost" type="button">拒绝</button>
    </div>
  </div>
</div>

<script src="engine.js?v=g9"></script>
<script src="render.js?v=g9"></script>
<script src="online.js?v=g17"></script>
<script src="ai.js?v=g9"></script>
<script src="lobby.js?v=l8"></script>
<script src="notify.js?v=n3"></script>
<script src="app.js?v=g23"></script>
  <script src="device.js?v=d1"></script>
</body>
</html>
